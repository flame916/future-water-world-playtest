<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0A1B26;color:#EDE7DA;

body{padding:14px 12px 80px;max-width:640px;margin:0 auto}
h1{font-size:19px;margin:2px 0 6px;font-weight:800}
.sub{font-size:11.5px;color:#8FA9B6;line-height:1.7;margin-bottom:12px}
.sub b{color:#C79A4A}

  border-bottom:1px solid rgba(237,231,218,.1);margin-bottom:10px}
.bar button{width:100%;padding:12px;font-family:inherit;font-size:13px;font-weight:800;
  border:none;border-radius:9px;background:#7A4A24;color:#EDE7DA;cursor:pointer}
.bar button:active{background:#A9743F}
.bar .stat{font-size:11px;color:#8FA9B6;margin-top:7px;text-align:center}
h2{font-size:14.5px;margin:18px 0 8px;font-weight:800;color:#C79A4A;

.use{margin-bottom:11px;background:#0F2836;border:1px solid rgba(237,231,218,.09);

.use.changed{border-color:rgba(199,154,74,.35)}
.usehead{display:flex;align-items:center;gap:7px;padding:9px 11px 7px;flex-wrap:wrap}

.tag.loop{background:#4A3A1B;color:#E8C583}

.tag.chg{background:#7A4A24;color:#F0D0A8}
.cand{display:flex;align-items:center;gap:9px;padding:7px 11px;

.cand.sel{background:rgba(199,154,74,.14)}
.cand.old{opacity:.62}
.play{flex:0 0 40px;height:34px;border-radius:8px;border:1px solid rgba(237,231,218,.18);
  background:#1B4A5A;color:#EDE7DA;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit}
.play:active{background:#22677C}
.play.on{background:#C79A4A;color:#0A1B26;border-color:#C79A4A}
.info{flex:1;min-width:0}
.info .t{font-size:11.5px;line-height:1.35;word-break:break-all}
.info .m{font-size:9.5px;color:#7B93A0;margin-top:2px}
.info .m a{color:#7B93A0;text-decoration:none}
.pick{flex:0 0 34px;height:34px;border-radius:8px;border:1px solid rgba(237,231,218,.18);
  background:#12303D;color:#7B93A0;font-size:15px;cursor:pointer;font-family:inherit}
.pick.on{background:#2D6A4F;border-color:#4FA37B;color:#C8F0DC}
.done{position:fixed;left:0;right:0;bottom:0;background:#122C3A;
  border-top:1px solid rgba(237,231,218,.15);padding:11px 14px;font-size:11px;
  color:#9FB3BE;display:none;z-index:20;max-height:60vh;overflow:auto}
.done.on{display:block}
.done b{color:#C79A4A}
.done .row2{display:flex;gap:8px;margin-top:8px;position:sticky;bottom:0;background:#122C3A;padding-top:8px}
.done button{flex:1;padding:11px;font-family:inherit;font-size:12px;font-weight:700;
  border-radius:8px;border:none;background:#1B4A5A;color:#EDE7DA;cursor:pointer}
.done button.primary{background:#C79A4A;color:#0A1B26}
.tip{font-size:11px;color:#6E8794;line-height:1.7;margin-top:18px}
</style>
</head>

</div>

function stopAll(){
  if(cur){ try{cur.pause();cur.currentTime=0;}catch(e){} cur=null; }
  if(curBtn){ curBtn.classList.remove('on'); curBtn.textContent='▶'; curBtn=null; }
}
function play(c,btn,loop){
  if(cur && curBtn===btn && !cur.paused){ stopAll(); return; }
  stopAll();
  var a=new Audio(); a.src=c.mp3; a.loop=!!loop; a.volume=0.9;
  a.onended=function(){ if(curBtn===btn){ btn.classList.remove('on'); btn.textContent='▶'; curBtn=null; cur=null; } };
  a.onerror=function(){ btn.textContent='!'; };
  var p=a.play(); if(p&&p.catch) p.catch(function(){ btn.textContent='!'; });
  cur=a; curBtn=btn; btn.classList.add('on'); btn.textContent='❚❚';
}
function refresh(){
  var n=Object.keys(sel).length;
  document.getElementById('stat').textContent='已选 '+n+' / '+TOTAL;
}
function setPick(it,row,pick,c){
  if(sel[it.key]===c.id){
    delete sel[it.key];
    markKey(it.key,null);
  } else {
    sel[it.key]=c.id;
    markKey(it.key,c.id);
  }
  refresh();
}
function markKey(key,id){
  document.querySelectorAll('.cand[data-key="'+key+'"]').forEach(function(r){
    var on = String(id)===r.getAttribute('data-id');
    r.classList.toggle('sel', on);
    var p=r.querySelector('.pick'); if(p) p.classList.toggle('on', on);
  });
}
function build(){
  var host=document.getElementById('list');
  DATA.forEach(function(g){
    host.appendChild(el('h2',null,g.group));
    g.items.forEach(function(it){
      var box=el('div','use');
      if(it.changed) box.classList.add('changed');
      var head=el('div','usehead');
      head.appendChild(el('b',null,it.label));
      if(it.loop) head.appendChild(el('span','tag loop','循环'));
      if(it.changed) head.appendChild(el('span','tag chg','已换'));
      head.appendChild(el('span','tag',it.cands.length+' 个'));
      box.appendChild(head);
      it.cands.forEach(function(c){
        var row=el('div','cand');
        row.setAttribute('data-key',it.key);
        row.setAttribute('data-id',c.id);
        if(!c.fresh) row.classList.add('old');
        var btn=el('button','play','▶');
        btn.addEventListener('click',function(){ play(c,btn,it.loop); });
        row.appendChild(btn);
        var info=el('div','info');
        info.appendChild(el('div','t',c.title));
        var m=el('div','m',c.dur+'s');
        if(c.fresh){ m.appendChild(document.createTextNode(' · ')); m.appendChild(el('span','tag new','新')); }
        m.appendChild(document.createTextNode(' · '));
        var lk=el('a',null,'freesound ↗'); lk.href=c.page; lk.target='_blank'; lk.rel='noopener';
        m.appendChild(lk);
        info.appendChild(m);
        row.appendChild(info);
        var pick=el('button','pick','✓');
        pick.addEventListener('click',function(){ setPick(it,row,pick,c); });
        row.appendChild(pick);
        box.appendChild(row);
      });
      host.appendChild(box);
    });
  });
  // 应用预设
  Object.keys(PRESET).forEach(function(k){ markKey(k, PRESET[k]); sel[k]=PRESET[k]; });
  refresh();
}
function labelOf(key){
  var o=allUse();
  for(var i=0;i<o.length;i++) if(o[i].key===key) return o[i].label;
  return key;
}
function findCand(key,id){
  var o=allUse();
  for(var i=0;i<o.length;i++){
    if(o[i].key!==key) continue;
    for(var j=0;j<o[i].cands.length;j++) if(o[i].cands[j].id===id) return o[i].cands[j];
  }
  return null;
}
function makeText(){
  var lines=[];
  DATA.forEach(function(g){
    var picked=g.items.filter(function(it){ return sel[it.key]; });
    if(!picked.length) return;
    lines.push('【'+g.group+'】');
    picked.forEach(function(it){
      var c=findCand(it.key,sel[it.key]);
      if(!c) return;
      lines.push('  '+it.label+' → '+c.title+'  ('+c.dur+'s, freesound '+c.id+')');
    });
    lines.push('');
  });
  return lines.length?lines.join('\n'):'（还没选）';
}
function showDone(){
  var n=Object.keys(sel).length;
  document.getElementById('doneTxt').innerHTML='<b>已选 '+n+' / '+TOTAL+'</b>，点「复制清单」后粘贴发我';
  document.getElementById('done').classList.add('on');
}
function hideDone(){ document.getElementById('done').classList.remove('on'); }
function copyOut(){
  var t=makeText();
  var ok=function(){ document.getElementById('doneTxt').innerHTML='<b>已复制</b>，去粘贴发我'; };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok,function(){ fb(t); });
  } else fb(t);
}
function fb(t){
  var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  document.getElementById('doneTxt').innerHTML='<b>已复制</b>';
}
document.getElementById('sendBtn').addEventListener('click',showDone);
build();
</script>
