*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{padding:14px 12px 60px;max-width:640px;margin:0 auto}
h1{font-size:19px;margin:2px 0 6px;font-weight:800}

.usehead b{font-size:13px}
.tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;

.play:active{background:#22677C}
.play.on{background:#C79A4A;color:#0A1B26;border-color:#C79A4A}
.info{flex:1;min-width:0}
.info .t{font-size:11.5px;line-height:1.35;word-break:break-all}
.info .m{font-size:9.5px;color:#7B93A0;margin-top:2px}
.info .m a{color:#7B93A0;text-decoration:none}
.pick{flex:0 0 34px;height:34px;border-radius:8px;border:1px solid rgba(237,231,218,.18);
  background:#12303D;color:#7B93A0;font-size:15px;cursor:pointer;font-family:inherit}
.pick.on{background:#2D6A4F;border-color:#4FA37B;color:#C8F0DC}
.done{position:fixed;left:0;right:0;bottom:0;background:#122C3A;
  border-top:1px solid rgba(237,231,218,.15);padding:11px 14px;font-size:11px;
  color:#9FB3BE;display:none;z-index:20}
.done.on{display:block}
.done b{color:#C79A4A}
.done .row2{display:flex;gap:8px;margin-top:8px}
.done button{flex:1;padding:11px;font-family:inherit;font-size:12px;font-weight:700;

.done button.primary{background:#C79A4A;color:#0A1B26}
.tip{font-size:11px;color:#6E8794;line-height:1.7;margin-top:18px}

var LOOPY = {'waves':1,'wind':1,'rain':1,'underwater':1,'deep_rumble':1,'engine':1,'sizzle':1};
var sel = {};          // key -> candidate id
var cur = null;        // 正在播的元素
var curBtn = null;

function allKeys(){
  var out = [];
  DATA.forEach(function(g){ g.items.forEach(function(it){ out.push(it.key); }); });
  return out;
}
var TOTAL = allKeys().length;

function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt != null) e.textContent = txt;
  return e;
}

function stopAll(){
  if(cur){ try{ cur.pause(); cur.currentTime = 0; }catch(e){} cur = null; }
  if(curBtn){ curBtn.classList.remove('on'); curBtn.textContent = '▶'; curBtn = null; }
}

function play(c, btn, loop){
  if(cur && curBtn === btn && !cur.paused){ stopAll(); return; }
  stopAll();
  var a = new Audio();
  a.src = c.mp3;
  a.loop = !!loop;
  a.volume = 0.9;
  a.onended = function(){ if(curBtn===btn){ btn.classList.remove('on'); btn.textContent='▶'; curBtn=null; cur=null; } };
  a.onerror = function(){ btn.textContent = '!'; btn.title = '加载失败'; };
  var p = a.play();
  if(p && p.catch) p.catch(function(){ btn.textContent = '!'; btn.title = '需要点击解锁音频'; });
  cur = a; curBtn = btn;
  btn.classList.add('on'); btn.textContent = '❚❚';
}

function updateStat(){
  var n = Object.keys(sel).length;
  var s = document.getElementById('stat');
  s.textContent = '已选 ' + n + ' / ' + TOTAL;
}

function build(){
  var host = document.getElementById('list');
  DATA.forEach(function(g){
    var h2 = el('h2', null, g.group);
    host.appendChild(h2);
    g.items.forEach(function(it){
      var box = el('div', 'use');
      var head = el('div', 'usehead');
      head.appendChild(el('b', null, it.label));
      if(it.loop) head.appendChild(el('span', 'tag loop', '循环'));
      head.appendChild(el('span', 'tag', it.cands.length + ' 个候选'));
      box.appendChild(head);

      it.cands.forEach(function(c){
        var row = el('div', 'cand');
        row.setAttribute('data-key', it.key);
        row.setAttribute('data-id', c.id);

        var btn = el('button', 'play', '▶');
        btn.addEventListener('click', function(){ play(c, btn, it.loop); });
        row.appendChild(btn);

        var info = el('div', 'info');
        info.appendChild(el('div', 't', c.title));
        var meta = el('div', 'm', c.dur + 's · ');
        var link = el('a', null, 'freesound ↗');
        link.href = c.page; link.target = '_blank'; link.rel = 'noopener';
        meta.appendChild(link);
        info.appendChild(meta);
        row.appendChild(info);

        var pick = el('button', 'pick', '✓');
        pick.addEventListener('click', function(){
          if(sel[it.key] === c.id){
            delete sel[it.key];
            document.querySelectorAll('.cand[data-key="' + it.key + '"]')
              .forEach(function(r){ r.classList.remove('sel'); });
            document.querySelectorAll('.cand[data-key="' + it.key + '"] .pick')
              .forEach(function(b){ b.classList.remove('on'); });
          } else {
            sel[it.key] = c.id;
            document.querySelectorAll('.cand[data-key="' + it.key + '"]')
              .forEach(function(r){ r.classList.remove('sel'); });
            document.querySelectorAll('.cand[data-key="' + it.key + '"] .pick')
              .forEach(function(b){ b.classList.remove('on'); });
            row.classList.add('sel'); pick.classList.add('on');
          }
          updateStat();
        });
        row.appendChild(pick);
        box.appendChild(row);
      });
      host.appendChild(box);
    });
  });
  updateStat();
}

function labelOf(key){
  for(var i=0;i<DATA.length;i++){
    for(var j=0;j<DATA[i].items.length;j++){
      if(DATA[i].items[j].key === key) return DATA[i].items[j].label;
    }
  }
  return key;
}

function makeText(){
  var lines = [];
  DATA.forEach(function(g){
    var picked = g.items.filter(function(it){ return sel[it.key]; });
    if(!picked.length) return;
    lines.push('【' + g.group + '】');
    picked.forEach(function(it){
      var c = null;
      it.cands.forEach(function(x){ if(x.id === sel[it.key]) c = x; });
      lines.push('  ' + it.label + ' → ' + c.title +
        '  (' + c.dur + 's, freesound ' + c.id + ')');
    });
    lines.push('');
  });
  if(!lines.length) lines.push('（还没选）');
  return lines.join('\n');
}

function showDone(){
  document.getElementById('doneTxt').innerHTML =
    '<b>已选 ' + Object.keys(sel).length + ' / ' + TOTAL + '</b>，点「复制清单」后粘贴发我';
  document.getElementById('done').classList.add('on');
}
function hideDone(){ document.getElementById('done').classList.remove('on'); }

function copyOut(){
  var t = makeText();
  var ok = function(){ document.getElementById('doneTxt').innerHTML = '<b>已复制</b>，去粘贴发给助手'; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok, function(){ fallback(t); });
  } else fallback(t);
}
function fallback(t){
  var ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  document.getElementById('doneTxt').innerHTML = '<b>已复制</b>（或手动全选复制）';
}

document.getElementById('sendBtn').addEventListener('click', showDone);

build();
</script>
