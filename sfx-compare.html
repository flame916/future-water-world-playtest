var ac=null, master=null, volume=0.6, players={};
function ensure(){
  if(ac) return ac;
  try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; return null; }
  master=ac.createGain(); master.gain.value=volume; master.connect(ac.destination);
  return ac;
}
function resume(){ var c=ensure(); if(c&&c.state==='suspended'&&c.resume){try{c.resume()}catch(e){}} }
function tone(opt){
  var c=ensure(); if(!c||!master) return;
  var freq=opt.freq||440, dur=opt.dur||0.12, delay=opt.delay||0;
  var type=opt.type||'sine', gain=opt.gain==null?0.2:opt.gain;
  try{
    var t0=c.currentTime+delay, osc=c.createOscillator(), g=c.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,t0);
    if(opt.to) osc.frequency.exponentialRampToValueAtTime(Math.max(30,opt.to),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(gain,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}

  throw:function(){tone({freq:320,to:190,dur:0.13,type:'sawtooth',gain:0.08})},
  catch:function(){tone({freq:420,to:640,dur:0.11,type:'triangle',gain:0.13});tone({freq:640,to:900,dur:0.09,type:'sine',gain:0.09,delay:0.07})},
  open:function(){tone({freq:880,dur:0.06,type:'square',gain:0.07});tone({freq:1320,dur:0.09,type:'square',gain:0.05,delay:0.06})},
  build:function(){tone({freq:160,to:92,dur:0.17,type:'sine',gain:0.20})},
  produce:function(){tone({freq:1040,dur:0.07,type:'sine',gain:0.09});tone({freq:1560,dur:0.09,type:'sine',gain:0.06,delay:0.05})},
  claim:function(){[523,659,784].forEach(function(f,i){tone({freq:f,dur:0.12,type:'triangle',gain:0.09,delay:i*0.07})})},
  discover:function(){[660,880,1100,1320].forEach(function(f,i){tone({freq:f,dur:0.15,type:'sine',gain:0.08,delay:i*0.085})})},
  milestone:function(){[392,523,659,784].forEach(function(f,i){tone({freq:f,dur:0.16,type:'triangle',gain:0.10,delay:i*0.075})})},
  fail:function(){tone({freq:230,to:120,dur:0.2,type:'sawtooth',gain:0.10})},
  pressure:function(){tone({freq:98,to:52,dur:0.55,type:'sine',gain:0.15});tone({freq:64,to:41,dur:0.75,type:'triangle',gain:0.09,delay:0.03})}
};
function getPlayer(n){
  if(!players[n]){ var a=new Audio(); a.preload='auto'; a.src=META[n].src; a.volume=volume; players[n]=a; }
  return players[n];
}
function playSyn(n){ resume(); if(SYN[n]) SYN[n](); }
function playAsset(n){ resume(); var p=getPlayer(n); try{ p.currentTime=0; p.play(); }catch(e){} }
var order=['tap','throw','catch','open','build','produce','claim','discover','milestone','fail','pressure'];
function playAll(kind){
  resume();
  order.forEach(function(n,i){
    setTimeout(function(){ kind==='syn'?playSyn(n):playAsset(n); }, i*820);
  });
}
(function build(){
  var host=document.getElementById('list');
  order.forEach(function(n){
    var m=META[n];
    var d=document.createElement('div'); d.className='row';
    d.innerHTML='<div class="rowhead"><b>'+m.label+'</b><em>'+m.spec+'</em></div>'+
      '<div class="rowuse">'+m.use+'</div>'+
      '<div class="btns">'+
        '<button class="syn" data-k="syn" data-n="'+n+'">程序合成<i>振荡器</i></button>'+
        '<button class="asset" data-k="asset" data-n="'+n+'">素材库<i>CC0 录音</i></button>'+
      '</div>';
    host.appendChild(d);
  });
  host.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    var n=b.getAttribute('data-n'), k=b.getAttribute('data-k');
    if(k==='syn') playSyn(n); else playAsset(n);
  });
})();
document.addEventListener('touchstart',function once(){resume();document.removeEventListener('touchstart',once)},{passive:true});
</script>
