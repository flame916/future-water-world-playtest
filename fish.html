  function dispatch(type, event) {
    const rect = main.getBoundingClientRect();

</script><script>﻿// 未来水世界 · 微信小游戏 MVP（A阶段，本地测试版）
// 画风：Raft《木筏求生》——明亮海面、原木木筏、绳索、帆布、铁钩；界面改为深色玻璃面板 + 奶油字 + 金色点缀。
// 玩法：木筏居中，360° 抓钩；三阶段木筏、四张升级卡、轻生存、净水器、本地存档、暂停。
// 广告：仅注释占位与空配置，未接入 SDK，未调用真实广告 API。

// ================= 环境 =================
const sys = (typeof wx !== 'undefined' && wx.getSystemInfoSync)
  ? wx.getSystemInfoSync()
  : { windowWidth: 390, windowHeight: 844, pixelRatio: 2 };
const DPR = Math.min(sys.pixelRatio || 1, 2);
const W = sys.windowWidth || 390;

const canvas = wx.createCanvas();
canvas.width = Math.round(W * DPR);

const ctx = canvas.getContext('2d');
ctx.scale(DPR, DPR);

const raf = (typeof requestAnimationFrame === 'function')
  ? requestAnimationFrame
  : (cb) => setTimeout(() => cb(Date.now()), 16);

console.log('[future-water-share-v1-minigame] boot', { W, H, DPR });

// ================= 配色 =================
const C = {
  ink: '#1E1E1E',
  deep: '#1B1B1B',
  panel: 'rgba(5,36,46,0.86)',
  panelSoft: 'rgba(255,255,255,0.07)',
  line: 'rgba(255,255,255,0.14)',
  foam: '#E3EAE4',
  sea0: '#5D8E8C',
  sea1: '#2E616B',
  sea2: '#1C4854',
  sea3: '#0F2F3A',
  wood: '#9C6B42',
  woodDark: '#46301F',
  woodLight: '#E3B77E',
  rope: '#D8B26A',
  ropeDark: '#8A6A38',
  sail: '#EFE7D6',
  cream: '#EDE7DA',
  creamSoft: 'rgba(255,244,218,0.72)',
  coral: '#B85C45',
  coralDark: '#8A3E2E',
  teal: '#3F6F6B',
  tealSoft: 'rgba(57,199,176,0.18)',
  gold: '#C79A4A',
  green: '#5E7F4E',
  iron: '#A3A9A6',
  ironDark: '#4A4F50',
};
// UI skin tokens are independent of inventory, geometry and gameplay rules.
const UI_SKINS={
  ocean:{name:'清爽海蓝',background:'#0B2034',background2:'#16425D',surface:'#112E44',surfaceRaised:'#21465F',coral:'#317BB1',coralDark:'#21567E',gold:'#83D9CE',cream:'#F1F7FC',creamSoft:'#B8CBDC',line:'#41617A',teal:'#50A6AA'},
  timber:{name:'暖木航海',background:'#292B29',background2:'#48534D',surface:'#343A34',surfaceRaised:'#4A5449',coral:'#A86442',coralDark:'#79482F',gold:'#E3C68F',cream:'#FFF4DF',creamSoft:'#CEC7B3',line:'#747661',teal:'#79A996'}
};
Object.assign(C,UI_SKINS.ocean);
function setSkin(id){if(!UI_SKINS[id])return false;state.skin=id;Object.assign(C,UI_SKINS[id]);state.dirty=true;saveGame();return true;}
function uiBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.background);g.addColorStop(1,C.background2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function uiBox(x,y,w,h,raised=false){ctx.fillStyle=raised?C.surfaceRaised:C.surface;roundRect(x,y,w,h,12);ctx.fill();}
function uiButton(b,label,secondary=false){ctx.fillStyle=secondary?C.surfaceRaised:C.coral;roundRect(b.x,b.y,b.w,b.h,8);ctx.fill();txt(label,b.x+b.w/2,b.y+b.h/2,13,C.cream,'700');}
function skinRect(id){return{x:20+(id==='timber'?(W-48)/2+8:0),y:612,w:(W-48)/2,h:48};}

// Cosmetic packages never change footprints, production, beds or combat stats.
const BUILDING_SKINS={
  salvage:{name:'拾荒棚屋',seconds:0,desc:'拼板外墙 · 补丁斜顶 · 绳扎支架',theme:'timber',walls:['#C9AE7F','#A88B61','#826747'],roof:['#8DA79A','#607F78','#C5AF82'],deck:['#BA8C58','#79603B','#624C32']},
  harbor:{name:'帆布港居',seconds:1200,desc:'高挑帆顶 · 条纹雨篷 · 船帆旗',theme:'ocean',walls:['#F1D9A1','#D8BF8B','#A37E58'],roof:['#E9AA5B','#C86E45','#E5C48D'],deck:['#D0AC78','#8E7451','#665541']},
  workshop:{name:'铁皮工坊',seconds:3600,desc:'平顶护栏 · 铆接铁墙 · 外置管道',theme:'ocean',walls:['#9BB4B0','#77958F','#526F6C'],roof:['#80A7A3','#527C7C','#BFA36A'],deck:['#A5AAA0','#6A7771','#495D59']}
};
let buildingPreviewId=null;
// AD-PLACEHOLDER: a future provider must verify a completed 15-second placement.
// This local build never creates an ad, starts a fake countdown or grants on click.
const SKIN_AD_POLICY={enabled:false,placement:'building_skin',targetSeconds:15};
let skinAdInFlight=false;
function appearanceQuip(id){
  if(id==='workshop')return homeCount('power')>0?'发电机到位，今晚终于不用摸黑了。':'过滤器之后，猫开始惦记发电机了。';
  if(id==='harbor')return homeCount('purifier')>0?'过滤器到位，先给猫倒一碗淡水。':'猫的愿望：先有淡水，再住好房。';
  return '筏子小归小，今晚不睡海里。';
}
async function requestAppearanceAd(provider=async()=>({status:'unavailable'})){
  const id=state.appearanceSelected||appearance().active;
  if(!BUILDING_SKINS[id]||appearance().owned.includes(id)||skinAdInFlight)return false;
  skinAdInFlight=true;
  // Capture the exact save object: a late result cannot reward a reset/loaded game.
  const owner=appearance();
  try{
    const result=await provider({placement:SKIN_AD_POLICY.placement,skinId:id,seconds:SKIN_AD_POLICY.targetSeconds});
    if(appearance()!==owner)return false;
    if(result?.status==='unavailable'){state.message='15秒广告暂未接通，可继续游玩解锁';state.messageTimer=4;return false;}
    const valid=result?.status==='completed'&&result.placement===SKIN_AD_POLICY.placement&&result.skinId===id&&result.adSeconds===15&&typeof result.receiptId==='string'&&result.receiptId.length>0&&result.receiptId.length<=128;
    if(!valid){state.message='广告未完成，皮肤尚未领取';state.messageTimer=3;return false;}
    if(owner.adReceipts.includes(result.receiptId))return false;
    owner.adReceipts.push(result.receiptId);owner.adReceipts=owner.adReceipts.slice(-64);
    if(!owner.owned.includes(id))owner.owned.push(id);
    state.message=`已领取${BUILDING_SKINS[id].name}，可直接换装`;state.messageTimer=4;state.dirty=true;saveGame();return true;
  }catch(e){state.message='广告暂不可用，稍后再试';state.messageTimer=3;return false;}

}
function makeAppearance(raw,legacySkin){
  const a={active:'salvage',seconds:Math.max(0,Math.min(315360000,Number(raw?.seconds)||0)),owned:['salvage'],adReceipts:Array.isArray(raw?.adReceipts)?raw.adReceipts.filter(x=>typeof x==='string'&&x.length>0&&x.length<=128).slice(-64):[]};
  if(raw&&Array.isArray(raw.owned))a.owned=[...new Set(['salvage',...raw.owned.filter(id=>BUILDING_SKINS[id])])];
  if(!raw&&legacySkin==='timber')a.owned.push('harbor'); // Keep a legacy appearance option usable.
  for(const [id,s]of Object.entries(BUILDING_SKINS))if(a.seconds>=s.seconds&&!a.owned.includes(id))a.owned.push(id);
  if(a.owned.includes(raw?.active))a.active=raw.active;
  return a;
}
function appearance(){return state.appearance||(state.appearance=makeAppearance());}
function buildingStyle(){return BUILDING_SKINS[buildingPreviewId||appearance().active]||BUILDING_SKINS.salvage;}
function updateAppearance(dt){
  const a=appearance(),before=Math.floor(a.seconds/5);a.seconds=Math.min(315360000,a.seconds+dt);
  if(Math.floor(a.seconds/5)!==before)state.dirty=true;
  for(const [id,s]of Object.entries(BUILDING_SKINS))if(a.seconds>=s.seconds&&!a.owned.includes(id)){
    a.owned.push(id);state.message=`新建筑外观已解锁：${s.name}`;state.messageTimer=4;state.dirty=true;saveGame();
  }
}
function equipBuildingSkin(id){
  const a=appearance();if(!BUILDING_SKINS[id]||!a.owned.includes(id))return false;
  a.active=id;state.appearanceSelected=id;setSkin(BUILDING_SKINS[id].theme);return true;
}
function appearanceRect(action){
  const ids=Object.keys(BUILDING_SKINS),i=ids.indexOf(action);
  if(i>=0)return{x:20,y:450+i*68,w:W-40,h:60};
  if(action==='back')return{x:W-90,y:14,w:70,h:42};
  if(action==='equip')return{x:20,y:674,w:W-40,h:46};
  if(action==='ad')return{x:20,y:730,w:W-40,h:40};
  return{x:20+(Number(action)-1)*(W-40)/3,y:390,w:(W-40)/3-6,h:40};
}
function openAppearance(){state.appearanceSelected=appearance().active;state.appearanceFloor=1;state.screen='appearance';state.aiming=false;}
function appearanceTouch(x,y){
  const inside=b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
  if(inside(appearanceRect('back'))){state.screen='ship';return;}
  for(const id of Object.keys(BUILDING_SKINS))if(inside(appearanceRect(id))){state.appearanceSelected=id;state.messageTimer=0;return;}
  for(let f=1;f<=3;f++)if(inside(appearanceRect(String(f)))){state.appearanceFloor=f;return;}
  if(inside(appearanceRect('equip'))){if(!equipBuildingSkin(state.appearanceSelected)){state.message='累计游玩达到要求后自动解锁';state.messageTimer=3;}return;}

}
function drawAppearanceScreen(){
  uiBackground();txt('家园外观',20,34,23,C.cream,'800','left');uiButton(appearanceRect('back'),'返回',true);
  const a=appearance(),id=state.appearanceSelected||a.active,s=BUILDING_SKINS[id];
  txt(`累计游玩 ${Math.floor(a.seconds/60)}分钟 · 外观不增加属性`,20,75,12,C.creamSoft,'600','left');
  txt(s.name,20,112,20,C.gold,'800','left');txt(s.desc,20,140,12,C.creamSoft,'600','left');
  const previous=homeRenderProjection,preview=buildingPreviewId;
  ctx.save();ctx.beginPath();ctx.rect(12,154,W-24,228);ctx.clip();
  try{
    buildingPreviewId=id;homeRenderProjection={scale:1.4,center:{sum:8,diff:0},origin:347};
    for(let r=3;r<=5;r++)for(let c=3;c<=5;c++)homePrism({r,c,width:1,height:1},-4,4,s.deck);
    drawHomeCabin({type:'cabin',uid:'cosmetic_preview',r:3,c:3,width:2,height:2,size:2,level:state.appearanceFloor||1},false);
    homePrism({r:5,c:5,width:1,height:1},0,13,s.walls);
    const p=homeIsoPos(5,5),scale=homeViewScale();ctx.save();ctx.translate(p.x,p.y-13*scale);ctx.scale(scale,scale);ctx.strokeStyle='#4B4135';ctx.lineWidth=1.7;drawPurifierModel();ctx.restore();
    drawBuildingTrim({type:'purifier',r:5,c:5,width:1,height:1},false);
  }finally{homeRenderProjection=previous;buildingPreviewId=preview;ctx.restore();}
  for(let f=1;f<=3;f++)uiButton(appearanceRect(String(f)),`${f}层预览`,state.appearanceFloor!==f);
  for(const [key,skin]of Object.entries(BUILDING_SKINS)){
    const b=appearanceRect(key),owned=a.owned.includes(key);uiBox(b.x,b.y,b.w,b.h,key===id);
    txt(`${key===id?'› ':''}${skin.name}${a.active===key?' · 使用中':''}`,b.x+12,b.y+20,15,C.cream,'700','left');
    txt(owned?'已解锁 · 可随时换装':`累计${skin.seconds/60}分钟解锁 · 还差${Math.ceil((skin.seconds-a.seconds)/60)}分钟`,b.x+12,b.y+43,12,owned?C.gold:C.creamSoft,'600','left');
  }

  return true;
}

// 生产参数与专长：净水房配机械师、厨房配厨师，匹配 +25%，不匹配 −25%
const PRODUCTION_TIME = { purifier: 60, kitchen: 90, net: 180 };

function catWorkSpeed(cat, type) {

function catProduction(dt) {

    const e = state.home.grid[homeIdx(f.r, f.c)];
    const p=eelPower(),powered=eelBoost(e)>1?Math.min(dt,p.remaining):0;

const OFFLINE_CAP_SEC = 4 * 3600;

function applyOfflineGains(lastSeen) {

  if (elapsed < 60) return;
  let water = 0, food = 0;
  for (const f of homeFacilities()) {
    if (f.type !== 'purifier' && f.type !== 'kitchen' && f.type !== 'net') continue;
    const cats = catsAtFacility(f.key).filter((cat) => !isExpeditionCat(cat));
    if (!cats.length) continue;
    const e = state.home.grid[homeIdx(f.r, f.c)];
    const need = f.type === 'purifier' ? 60 : 90;
    const speed = cats.reduce((sum, cat) => sum + 1 + (cat.level - 1) * 0.1 + (cat.mood - 50) / 200, 0);

function updateShoal(dt) {
  if (state.shoalLeft > 0) {
    state.shoalLeft -= dt;
    state.shoalSpawn -= dt;
    if (state.shoalSpawn <= 0 && state.debris.filter((d) => d.fish && !d.caught).length < 6) {
      state.shoalSpawn = 1.2;
      spawnFish();
    }
    if (state.shoalLeft <= 0) state.shoalLeft = 0;
    return;
  }
  state.shoalTimer -= dt;
  if (state.shoalTimer <= 0) {
    state.shoalLeft = 25;
    state.shoalSpawn = 0;
    state.shoalTimer = (state.bandIndex === 3 ? 65 : 150) + Math.random() * 60;
    state.message = '鱼群来了！25 秒内多抓几条';
    state.messageTimer = 3;
  }

function spawnRandomDebris() {
  if (state.catGuarantee && state.cats.length < catCap() && !state.debris.some((d) => d.catPod)) {
    spawnCatPod('猫舱');
    return;
  }
  if (Math.random() < 0.02 && state.cats.length < catCap() && !state.debris.some((d) => d.catPod)) {
    spawnCatPod('救生舱');
    return;
  }
  if (Math.random() < 0.05 && state.cats.length < catCap() && !state.debris.some((d) => d.catPod)) {
    spawnCatPod('猫舱');
    return;
  }
  // 泥土与种子：家园食物链的原料，从近海就会漂来
  const profile = ROUTES[state.bandIndex];
  let resourceRoll = Math.random();
  if ((resourceRoll -= profile.silt) < 0) { spawnSiltCrate(); return; }
  if ((resourceRoll -= profile.seed) < 0) { spawnSeedKit(); return; }
  if ((resourceRoll -= profile.tangle) < 0) { spawnTangle(); return; }
  if ((resourceRoll -= profile.oil) < 0) { spawnOilBarrel(); return; }
  const band = state.bandIndex;
  let tier = 'drift';
  const r = Math.random();
  if (r < profile.heavy) tier = 'heavy';
  else if (r < profile.heavy + 0.30) tier = 'supply';
  const t = CRATE_TIERS[tier];
  state.debris.push({
    key: 'crate',
    crateTier: tier,
    contents: rollCrateContents(tier),
    def: { label: t.name, r: t.r, retract: t.retract, value: {} },

function makeKit(raw) {

function kitForkCatch(first,tip){
  if(!kitHas('fork')||!['wood','plastic'].includes(first.key)||first.tangle||first.oilBarrel||first.toolCrate||first.catPod||first.specialSite||kitHeavy(first))return;
  const second=state.debris.find(d=>d!==first&&kitLight(d)&&Math.hypot(d.x-first.x,d.y-first.y)<=36);

function kitEmptyReturn(missed){

    k.emptyRuns=0;

function chooseKitOffer(index){

function makeDefense(raw) {
  if(!raw||raw.v!==1)return null;
  const n=(v,max)=>clamp(Number(v)||0,0,max),r=raw;
  const rescuePayload={wood:0,plastic:0,iron:0};let rescueCap=2;
  for(const k of Object.keys(rescuePayload)){rescuePayload[k]=Math.min(rescueCap,n(r.rescuePayload?.[k],2)|0);rescueCap-=rescuePayload[k];}
  return {v:1,mode:r.mode==='advanced'?'advanced':'tutorial',phase:['ready','warning','approach','feint','tempt','windup','rush','recover','safe','rescue','ending','result','done'].includes(r.phase)?r.phase:'ready',
    timer:n(r.timer,12),nerve:n(r.nerve,3),strikes:n(r.strikes,3)|0,hits:n(r.hits,99)|0,catPulses:n(r.catPulses,99)|0,
    lost:n(r.lost,2)|0,cargo:{wood:n(r.cargo?.wood,999)|0,plastic:n(r.cargo?.plastic,999)|0,iron:n(r.cargo?.iron,999)|0},
    crewEnabled:r.crewEnabled!==false,catTimer:n(r.catTimer,4),flash:0,outcome:r.outcome==='repelled'?'repelled':'left',
    elapsed:n(r.elapsed,999),banked:!!r.banked,probeHits:n(r.probeHits,99)|0,coverUsed:!!r.coverUsed,
    lureStatus:['sea','held','collected','missed'].includes(r.lureStatus)?r.lureStatus:'none',lureLife:n(r.lureLife,8),lureX:n(r.lureX,W),lureY:n(r.lureY,SEA_BOTTOM),
    dropped:n(r.dropped??r.lost,2)|0,recovered:n(r.recovered,2)|0,rescueStatus:['sea','held','recovered','expired'].includes(r.rescueStatus)?r.rescueStatus:'none',rescueRemaining:n(r.rescueRemaining,8),rescuePayload};
}
function defenseActive(){return globalThis.__defenseSample===true&&!!state.defense;}
function defenseAdvanced(){return defenseActive()&&state.defense.mode==='advanced';}
function defenseRunning(){return defenseActive()&&['warning','approach','feint','tempt','windup','rush','recover','safe','rescue'].includes(state.defense.phase);}
function defenseCrew(){return state.cats.find(c=>!c.job&&!c.manualRest&&!isExpeditionCat(c)&&c.energy>20);}
function defenseLossCap(){return homeCount('fence')>0?1:2;}
function defenseCargoText(){const c=state.defense.cargo;return `木${c.wood} 塑${c.plastic} 铁${c.iron}`;}
function defenseRescueText(){return Object.entries(state.defense.rescuePayload).filter(([,v])=>v>0).map(([k,v])=>({wood:'木',plastic:'塑',iron:'铁'}[k]+v)).join('＋');}
function defenseRescuePoint(){const a=hookAnchor(),t=8-state.defense.rescueRemaining;return {x:clamp(a.x-25-t*1.2,32,W-32),y:clamp(a.y+70+t*4.5,TOP_H+80,SEA_BOTTOM-36)};}
function spawnDefenseRescue(payload){

function updateDefenseRescue(dt){
  const d=state.defense;if(!defenseAdvanced()||d.phase!=='rescue')return;
  if(['recovered','expired'].includes(d.rescueStatus)){defenseFinish('left');return;}
  const h=state.hook;
  if(d.rescueStatus==='sea'){
    d.rescueRemaining=Math.max(0,d.rescueRemaining-dt);
    if(d.rescueRemaining<=0){
      d.rescueStatus='expired';d.lost=Math.min(2,d.lost+Object.values(d.rescuePayload).reduce((a,b)=>a+b,0));
      state.debris=state.debris.filter(x=>!x.defenseRescue||x.caught);
      state.message='浮货包漂远了，这部分才记为损失';state.messageTimer=2.5;state.dirty=true;saveGame();return;
    }

function grantDefenseRescue(pack){

  state.message=`已救回${defenseRescueText()}，重新放入待入库物资`;state.messageTimer=3;state.dirty=true;saveGame();return true;

function defensePoint(){

  const rush=d.phase==='rush'?clamp(1-d.timer/.45,0,1):0;
  const feint=d.phase==='feint'?Math.sin((2.4-d.timer)/2.4*Math.PI)*34:0;
  const recoil=defenseAdvanced()&&['feint','tempt'].includes(d.phase)?d.flash*20:0;
  return {x:clamp(a.x+side*(48+far*18+feint)*(1-rush*.75),35,W-35),y:clamp(a.y+90+far*14-rush*60+recoil,TOP_H+90,SEA_BOTTOM-38)};
}
function spawnDefenseLure(){

function updateDefenseLure(dt){
  if(!defenseAdvanced())return;
  const d=state.defense;
  if(['result','done'].includes(d.phase)){
    if(d.lureStatus!=='collected')d.lureStatus='missed';
    state.debris=state.debris.filter(x=>!x.defenseLure||x.caught);return;
  }
  if(d.lureStatus==='held'&&!state.hook.hold?.defenseLure&&!state.debris.some(x=>x.defenseLure&&x.caught))d.lureStatus='sea';
  if(d.lureStatus==='sea'){
    d.lureLife=Math.max(0,d.lureLife-dt);
    if(d.lureLife<=0){d.lureStatus='missed';homeNotice('重料箱漂远了，没有扣除已得物资');}
    else if(!state.debris.some(x=>x.defenseLure))state.debris.push({key:'iron',defenseLure:true,x:d.lureX,y:d.lureY,vy:0,caught:false,scale:1,rot:0,rotDir:0,foam:0,
      def:{label:'重料箱',r:22,retract:.045,value:{wood:2,iron:4}}});
  }
  if(['missed','collected'].includes(d.lureStatus))state.debris=state.debris.filter(x=>!x.defenseLure||x.caught);

function releaseDefenseLure(){

  const h=state.hook,box=h.hold,d=state.defense,a=hookAnchor(),p=hookTip();

function defenseFinish(outcome){

function defenseGrant(d){

  if(!defenseActive()||state.defense.phase==='done'||!['wood','plastic','iron'].includes(d.key)||d.contents||d.specialSite||d.catPod||d.tangle||d.oilBarrel||d.toolCrate)return false;

function updateDefense(dt,prev,tip){
  if(!defenseActive()||state.screen!=='salvage')return;
  const d=state.defense,h=state.hook;d.flash=Math.max(0,d.flash-dt);
  updateDefenseLure(dt);
  if(d.phase==='rescue'){updateDefenseRescue(dt);return;}
  if(d.phase==='ending'){
    if(!homeRigBusy()&&!state.debris.some(x=>x.caught)){
      if(d.lureStatus==='sea'){d.lureStatus='missed';state.debris=state.debris.filter(x=>!x.defenseLure);}
      d.phase='result';state.dirty=true;saveGame();
    }return;
  }
  if(!defenseRunning())return;
  d.elapsed+=dt;
  const target=defensePoint();
  if(!['warning','safe'].includes(d.phase)&&h.extending&&!h.automatic&&sweepHit(prev,tip,target.x,target.y,23)){
    const realAttack=['windup','rush'].includes(d.phase),early=defenseAdvanced()&&!realAttack;
    if(early)d.probeHits++;else d.hits++;
    d.nerve=Math.max(0,d.nerve-(early?.35:1.25));d.flash=.5;
    h.defenseStrike=true;h.extending=false;h.retracting=true;state.clawOpen=.08;state.clawSnap=.22;
    state.message=early?'它只是在试探！重箱即将经过':defenseAdvanced()?'打断成功！获得6秒安全打捞时间':'打断冲撞！掠食鱼被推远';state.messageTimer=1.5;
    addFloaterAt(early?'推远':'打断！',C.gold,target.x,target.y-25);haptic();
    if(defenseAdvanced()){
      if(realAttack){d.nerve=0;d.phase='safe';d.timer=6;d.outcome='repelled';}
      state.dirty=true;saveGame();return;
    }
    if(d.nerve<=0){defenseFinish('repelled');return;}
    d.phase='recover';d.timer=2.8;state.dirty=true;saveGame();return;
  }
  if(!['warning','safe'].includes(d.phase)&&d.crewEnabled){
    const cat=defenseCrew();
    if(cat){d.catTimer-=dt;if(d.catTimer<=0){d.catTimer=4;d.catPulses++;d.nerve=Math.max(0,d.nerve-.35);d.flash=.35;cat.energy=Math.max(0,cat.energy-.5);addFloaterAt('猫协防',C.cream,hookAnchor().x+30,hookAnchor().y-20);if(d.nerve<=0&&!defenseAdvanced()){defenseFinish('repelled');return;}}}
  }
  d.timer-=dt;
  if(d.timer>0)return;
  if(d.phase==='warning'){d.phase='approach';d.timer=3;}
  else if(d.phase==='approach'&&defenseAdvanced()){d.phase='feint';d.timer=2.4;}
  else if(d.phase==='feint'){spawnDefenseLure();updateDefenseLure(0);d.phase='tempt';d.timer=4.4;state.message='重箱铁4木2：5秒内抓，回收也慢';state.messageTimer=2.5;}
  else if(d.phase==='safe'){defenseFinish('repelled');return;}
  else if(d.phase==='approach'||d.phase==='recover'||d.phase==='tempt'){d.phase='windup';d.timer=3.2;}
  else if(d.phase==='windup'){
    if(defenseAdvanced()&&d.crewEnabled&&defenseCrew()&&d.catPulses>=2&&!d.coverUsed){d.coverUsed=true;d.timer=2;state.message='猫拍水牵制，替你多争取2秒！';state.messageTimer=2;}
    else {d.phase='rush';d.timer=.45;}
  }
  else if(d.phase==='rush'){

    cargo:amount(raw.cargo),payload,dropped:Math.floor(n(raw.dropped,2)),recovered:Math.floor(n(raw.recovered,2)),lost:Math.floor(n(raw.lost,2)),repelled:Math.floor(n(raw.repelled,2)),impacts:Math.floor(n(raw.impacts,2)),
    tactic:['volley','shield'].includes(raw.tactic)?raw.tactic:null,shield:!!raw.shield,shieldUsed:!!raw.shieldUsed,protected:!!raw.protected,
    rescueStatus:['sea','hauling','recovered','expired'].includes(raw.rescueStatus)?raw.rescueStatus:'sea',haul:n(raw.haul,3),rescueRemaining:n(raw.rescueRemaining,8),
    banked:!!raw.banked,actual:amount(raw.actual),overflow:amount(raw.overflow),shots:Math.floor(n(raw.shots,999)),reloads:Object.fromEntries(Object.entries(raw.reloads||{}).slice(0,81).filter(([k])=>/^home_\d+$/.test(k)).map(([k,v])=>[k,n(v,2.8)])),flash:0,flashSide:'left',sample:!!raw.sample};

    if(Object.values(d.payload).some(n=>n>0)){d.phase='rescue';d.rescueStatus='sea';d.rescueRemaining=8;d.haul=0;}

  }
  state.dirty=true;saveGame();
}

function autoSalvage(dt) {
  if(defenseActive()&&['ending','result'].includes(state.defense.phase))return;

  const cat = state.cats.find((c) => !isExpeditionCat(c) && c.energy > 12 && hookKeys.includes(c.job));

  const h = state.hook;
  if (!h.swinging || h.extending || h.retracting || h.hold) return;

    if (d.tangle || d.oilBarrel || d.specialSite || d.toolCrate || d.defenseLure || d.defenseRescue) continue;

function update(dt,playDt=dt) {

  // 结算面板打开时冻住模拟（但不清档、不重置）

  state.shake = Math.max(0, state.shake - dt);
  state.impact = Math.max(0, state.impact - dt);
  if (state.hookLock > 0) state.hookLock = Math.max(0, state.hookLock - dt);
  if (state.mudSplash > 0) state.mudSplash = Math.max(0, state.mudSplash - dt * 0.12);
  if (state.oilStain > 0) state.oilStain = Math.max(0, state.oilStain - dt * 0.08);

  }

    for (const p of state.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; }

  updateRainBarrel(dt);

  updateSpecialSite();
  updateToolCrate(dt);

  autoSalvage(dt);

  updateHookSwing(dt);

  const prev = hookTip();

  } else if (h.retracting) {

      state.purifierTimer = 0;
      const add = Math.min(pcount, 2);
      if (state.supplies.water < supplyCap()) {
        state.supplies.water = Math.min(supplyCap(), state.supplies.water + add);
        addFloater(`净水 +${add}`, C.teal);
        state.dirty = true;
      }
    }
  }

  // 猫居民：饥饿/精力/心情 + 设施实际产出
  updateNodes(dt);
  updateGarden(dt);
  updateCompost(dt);
  updatePressure(dt);
  updateCats(dt);
  catProduction(dt);
  updateExpedition(dt);
  updateHomeLoop();

  for (const f of state.floaters) { f.life -= dt; f.y += f.vy * dt; f.vy += 120 * dt; }
  state.floaters = state.floaters.filter((f) => f.life > 0);
  for (const p of state.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 240 * dt; }
  state.particles = state.particles.filter((p) => p.life > 0);
  if (Math.random() < dt * 6) state.bubbles.push({ x: rand(0, W), y: SEA_BOTTOM - rand(0, 20), r: rand(1.5, 4), life: rand(2, 4), vy: rand(-40, -18) });
  for (const b of state.bubbles) { b.life -= dt; b.y += b.vy * dt; }
  state.bubbles = state.bubbles.filter((b) => b.life > 0);

  state.saveTimer += dt;
  if (state.dirty && state.saveTimer > 2) { state.saveTimer = 0; saveGame(); }
}

function sweepHit(p0, p1, cx, cy, r) {
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  const len2 = dx * dx + dy * dy;
  if (len2 < 1e-6) return Math.hypot(cx - p1.x, cy - p1.y) <= r;
  let t = ((cx - p0.x) * dx + (cy - p0.y) * dy) / len2;
  t = clamp(t, 0, 1);
  const px = p0.x + dx * t, py = p0.y + dy * t;
  return Math.hypot(cx - px, cy - py) <= r;
}

function onHookHit(d, tip) {
  if(d.defenseRescue&&defenseAdvanced()){state.defense.rescueStatus='held';saveGame();}
  if(d.defenseLure&&defenseAdvanced()){state.defense.lureStatus='held';saveGame();}
  const y = Math.max(TOP_H + 30, tip.y - 16);
  if (state.combo >= 2) addFloaterAt(`x${state.combo}`, C.gold, tip.x, y - 16);
  // 猫舱/淤泥箱/种子包都有各自的结算文案，不再叠一个泛泛的“入手”
  if (d.catPod || d.silt || d.seedKit || d.fish) return;
  const v = (d.def && d.def.value) || {};
  const nums = Object.keys(v).filter((k) => typeof v[k] === 'number' && v[k] > 0);
  const heavy = d.def && d.def.retract < 0.8;
  if (heavy) {
    addFloaterAt('沉！', C.coral, tip.x, y + 2);

    addFloaterAt(`+${v[nums[0]]}${label}`, C.gold, tip.x, y + 2);

    addFloaterAt('入手', C.gold, tip.x, y + 2);
  }
  if (state.tutorialStep === 2) {

    state.tutorialStepAt = state.time;

// 美漫质感：半调网点 + 斜排线
let comicDotPattern = null;
function getComicDotPattern() {
  if (comicDotPattern !== null) return comicDotPattern;
  try {
    let cv = null;
    if (typeof wx !== 'undefined' && wx.createCanvas) cv = wx.createCanvas();
    else if (typeof document !== 'undefined' && document.createElement) cv = document.createElement('canvas');
    if (!cv) { comicDotPattern = false; return false; }
    cv.width = 10; cv.height = 10;
    const c2 = cv.getContext('2d');
    c2.fillStyle = 'rgba(20,17,13,0.55)';
    c2.beginPath(); c2.arc(5, 5, 1.15, 0, Math.PI * 2); c2.fill();
    comicDotPattern = ctx.createPattern(cv, 'repeat');
  } catch (e) { comicDotPattern = false; }
  return comicDotPattern;
}
function drawComicTexture(x, y, w, h, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const pat = getComicDotPattern();
  if (pat) { ctx.fillStyle = pat; ctx.fillRect(x, y, w, h); }
  // 斜排线
  ctx.strokeStyle = 'rgba(20,17,13,0.55)';
  ctx.lineWidth = 1;
  for (let i = -h; i < w; i += 18) {
    ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke();
  }
  ctx.restore();
}

      ctx.strokeStyle = '#D8B26A'; ctx.beginPath(); ctx.moveTo(-8, 3); ctx.lineTo(-8, -32); ctx.lineTo(12, -16); ctx.stroke();
    } else if (d.siteRoute === 1) {
      ctx.fillStyle = '#829E72'; ctx.fillRect(-27, -6, 54, 25); ctx.strokeRect(-27, -6, 54, 25);
      ctx.strokeStyle = '#B7D5CF'; ctx.beginPath(); ctx.moveTo(-27, -6); ctx.lineTo(0, -31); ctx.lineTo(27, -6); ctx.stroke();
      ctx.fillStyle = '#B9D18A'; ctx.beginPath(); ctx.ellipse(-10, -7, 6, 12, -0.4, 0, Math.PI * 2); ctx.ellipse(8, -7, 6, 12, 0.4, 0, Math.PI * 2); ctx.fill();
    } else if (d.siteRoute === 3) {
      ctx.fillStyle = '#558D81'; ctx.beginPath(); ctx.ellipse(0, 8, 32, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#CFD9B1'; ctx.beginPath(); ctx.ellipse(-6, -3, 13, 6, -0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(7, -3); ctx.lineTo(18, -12); ctx.lineTo(18, 4); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = '#A87849'; ctx.fillRect(-25, -15, 50, 34); ctx.strokeRect(-25, -15, 50, 34);
      ctx.fillStyle = '#EFE7D6'; ctx.fillRect(-5, -10, 10, 24); ctx.fillRect(-12, -3, 24, 9);
    }
    ctx.fillStyle = C.gold; ctx.beginPath(); ctx.moveTo(23, -34); ctx.lineTo(23, -14); ctx.lineTo(37, -25); ctx.closePath(); ctx.fill();
    ctx.restore(); drawDebrisLabel(d); return;
  }
  if (d.key === 'crate' || d.key === 'silt') {
    drawCrateBox(d, s, bob);
    drawDebrisLabel(d);
    return;
  }
  if (spriteState.ready && spritesEnabled) {
    const f = SPRITE_FRAMES['debris/' + d.key];
    if (f) {
      if (d.glow || homeCount('searchlight') > 0) {
        ctx.save();
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = d.glow ? 'rgba(255,201,60,0.4)' : 'rgba(237,231,218,0.22)';
        ctx.beginPath();
        ctx.ellipse(d.x, d.y + bob, d.def.r + 10, d.def.r + 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      drawSprite('debris/' + d.key, d.x, d.y + bob);
      drawDebrisLabel(d);
      return;
    }
  }
  ctx.save();
  ctx.translate(d.x, d.y + bob);

  // 水面阴影 + 泡沫圈
  ctx.fillStyle = 'rgba(4,42,56,0.22)';
  ctx.beginPath(); ctx.ellipse(4, d.def.r * 0.85, d.def.r * 0.75, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(234,253,255,${0.32 + Math.sin(d.foam) * 0.1})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, d.def.r * 0.85, d.def.r + 9, 8, 0, 0, Math.PI * 2); ctx.stroke();

  ctx.rotate(d.rot + Math.sin(state.time * 1.4 + d.foam) * 0.04);
  ctx.scale(s, s);
  if (d.glow) { ctx.shadowColor = 'rgba(255,201,60,0.75)'; ctx.shadowBlur = 15; }

  switch (d.key) {
    case 'wood': drawPlankBundle(); break;
    case 'plastic': drawBottleCluster(); break;
    case 'iron': drawScrapGear(); break;
    case 'crate': drawSupplyBarrel(); break;
    case 'seed': drawSeedPouch(); break;
    case 'tangle': drawTangleNet(); break;
    case 'oil': drawOilBarrel(); break;
    case 'fish': d.fishSpecies==='eel'?drawElectricEel(false):drawFish(d.big); break;
    case 'care': drawCareSack(d.forcedKind === 'water'); break;
  }
  ctx.restore();

  // 闪光
  const tw = Math.sin(state.time * 3 + d.foam * 2);
  if (tw > 0.93) {
    const px = d.x + d.def.r * 0.35;
    const py = d.y + bob - d.def.r * 0.45;
    drawSparkle(px, py, 5 + tw * 2);
  }

  drawDebrisLabel(d);
}

function drawCrateBox(d, s, bob) {
  const w = d.crateTier === 'heavy' ? 38 : d.crateTier === 'supply' ? 34 : 32;
  const h = d.crateTier === 'heavy' ? 30 : 27;
  const woodCol = d.crateTier === 'silt' ? '#6B5335' : d.crateTier === 'drift' ? '#8A5A33' : d.crateTier === 'supply' ? '#5F6B45' : '#6E5A48';
  const bandCol = d.crateTier === 'silt' ? '#4A3B28' : d.crateTier === 'heavy' ? '#3D4A4E' : '#4E3A26';
  ctx.save();
  ctx.translate(d.x, d.y + bob);
  // 水面阴影
  ctx.fillStyle = 'rgba(3,22,28,0.34)';
  ctx.beginPath(); ctx.ellipse(4, h * 0.55, w * 0.5, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(221,227,218,${0.35 + Math.sin(d.foam) * 0.1})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, h * 0.55, w * 0.62 + 8, 8, 0, 0, Math.PI * 2); ctx.stroke();

  ctx.rotate(d.rot + Math.sin(state.time * 1.4 + d.foam) * 0.04);
  ctx.scale(s, s);
  if (d.glow) { ctx.shadowColor = 'rgba(217,162,58,0.8)'; ctx.shadowBlur = 14; }
  const x0 = -w / 2, y0 = -h / 2;
  // 箱体（漫画墨线 + 木纹）
  const g = ctx.createLinearGradient(x0, y0, x0, y0 + h);
  g.addColorStop(0, '#C08A54');
  g.addColorStop(0.45, woodCol);
  g.addColorStop(1, '#4A2E1B');
  ctx.fillStyle = g;
  ctx.strokeStyle = '#17140F';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.rect(x0, y0, w, h);
  ctx.fill(); ctx.stroke();
  // 木条
  ctx.strokeStyle = 'rgba(30,22,16,0.55)';
  ctx.lineWidth = 1.4;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(x0 + (w / 4) * i, y0 + 2); ctx.lineTo(x0 + (w / 4) * i, y0 + h - 2); ctx.stroke();
  }
  // 铁箍
  ctx.strokeStyle = bandCol;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x0, y0 + 4); ctx.lineTo(x0 + w, y0 + 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0, y0 + h - 4); ctx.lineTo(x0 + w, y0 + h - 4); ctx.stroke();
  ctx.strokeStyle = 'rgba(230,220,200,0.35)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x0 + 1, y0 + 3); ctx.lineTo(x0 + w - 1, y0 + 3); ctx.stroke();
  // 角钉
  ctx.fillStyle = '#B9A489';
  for (const dx of [x0 + 3, x0 + w - 3]) {
    for (const dy of [y0 + 4, y0 + h - 4]) {
      ctx.beginPath(); ctx.arc(dx, dy, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 盖缝 + 标签
  ctx.strokeStyle = '#17140F'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0 + 3, y0 + h * 0.42); ctx.lineTo(x0 + w - 3, y0 + h * 0.42); ctx.stroke();
  ctx.fillStyle = 'rgba(232,222,198,0.85)';
  ctx.fillRect(x0 + w * 0.28, y0 + h * 0.55, w * 0.44, h * 0.26);
  ctx.strokeStyle = '#17140F'; ctx.lineWidth = 1;
  ctx.strokeRect(x0 + w * 0.28, y0 + h * 0.55, w * 0.44, h * 0.26);
  ctx.fillStyle = '#17140F';
  ctx.font = '900 10px "Arial Black", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(d.crateTier === 'heavy' ? '!' : d.crateTier === 'supply' ? '+' : '?', 0, y0 + h * 0.68);
  // 斜向排线（美漫阴影）
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, y0 + h * 0.42, w * 0.28, h * 0.56); ctx.clip();
  ctx.strokeStyle = 'rgba(20,16,12,0.35)'; ctx.lineWidth = 1;
  for (let i = -h; i < w; i += 5) {
    ctx.beginPath(); ctx.moveTo(x0 + i, y0 + h); ctx.lineTo(x0 + i + h, y0); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

function drawDebrisLabel(d) {
  const bob = Math.sin(state.time * 2 + d.foam) * 2;
  if (d.specialSite || homeCount('searchlight') > 0 || Math.hypot(d.x - BOAT.x, d.y - BOAT.y) > 98) {
    ctx.font = '600 10px sans-serif';
    const label = d.def.label;
    const tw2 = ctx.measureText(label).width + 14;
    ctx.fillStyle = 'rgba(5,36,46,0.7)';
    roundRect(d.x - tw2 / 2, d.y + d.def.r + 8 + bob, tw2, 17, 8); ctx.fill();
    ctx.fillStyle = d.glow ? C.gold : C.cream;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, d.x, d.y + d.def.r + 16.5 + bob);
  }
}

function drawSparkle(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.18, -r * 0.18, r, 0);
  ctx.quadraticCurveTo(r * 0.18, r * 0.18, 0, r);
  ctx.quadraticCurveTo(-r * 0.18, r * 0.18, -r, 0);
  ctx.quadraticCurveTo(-r * 0.18, -r * 0.18, 0, -r);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPlankBundle() {
  for (let i = 0; i < 4; i++) {
    const y = -15 + i * 8;
    const skew = (i % 2 ? 1 : -1) * 1.5;
    const g = ctx.createLinearGradient(0, y, 0, y + 7);
    g.addColorStop(0, '#F8D8A4');
    g.addColorStop(0.35, C.wood);
    g.addColorStop(1, '#8A4E25');
    ctx.fillStyle = g;
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-27 + skew, y);
    ctx.lineTo(27 + skew, y);
    ctx.lineTo(25 + skew, y + 7);
    ctx.lineTo(-25 + skew, y + 7);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 木纹
    ctx.strokeStyle = 'rgba(110,69,39,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-21 + skew, y + 2.4); ctx.lineTo(20 + skew, y + 2.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-16 + skew, y + 4.8); ctx.lineTo(23 + skew, y + 4.8); ctx.stroke();
    // 端面
    ctx.fillStyle = 'rgba(255,226,180,0.75)';
    ctx.beginPath(); ctx.ellipse(-26 + skew, y + 3.5, 2, 3.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(26 + skew, y + 3.5, 2, 3.2, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 绳捆
  ctx.strokeStyle = C.ropeDark;
  ctx.lineWidth = 3;
  for (const x of [-13, 12]) {
    ctx.beginPath(); ctx.moveTo(x, -17); ctx.lineTo(x - 1, 17); ctx.stroke();
    ctx.fillStyle = C.rope;
    ctx.beginPath(); ctx.arc(x, -1, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 1, 8, 2.2, 0, Math.PI * 2); ctx.fill();
  }
  // 顶部高光
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-23, -14); ctx.lineTo(21, -14); ctx.stroke();
}

function drawBottleCluster() {
  const bottles = [[-9, -5, -0.32], [7, -3, 0.24], [0, 8, 0.06]];

  ctx.strokeStyle = C.ropeDark;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 1, 20, -0.7, 2.1); ctx.stroke();

  ctx.beginPath(); ctx.arc(19, 3, 2, 0, Math.PI * 2); ctx.fill();

function drawScrapGear() {
  const teeth = 9;
  const outer = 24, inner = 17, hole = 7;
  const g = ctx.createLinearGradient(-20, -20, 20, 20);
  g.addColorStop(0, '#E3EDF3');
  g.addColorStop(0.45, C.iron);
  g.addColorStop(1, '#61798A');
  ctx.fillStyle = g;
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const ang = (i * Math.PI) / teeth - Math.PI / 2;
    const rad = i % 2 === 0 ? outer : inner;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 中心孔
  ctx.fillStyle = 'rgba(4,42,56,0.55)';
  ctx.beginPath(); ctx.arc(0, 0, hole, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 0, hole + 2, 0, Math.PI * 2); ctx.stroke();
  // 锈斑
  [[-9, -8, 5], [10, 5, 4], [-11, 9, 3], [12, -10, 3]].forEach(([x, y, r]) => {
    ctx.fillStyle = 'rgba(210,70,46,0.5)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  });
  // 铆钉
  [[-13, 1], [13, 0], [1, -13], [0, 13]].forEach(([x, y]) => {
    ctx.fillStyle = '#F2F8FC';
    ctx.beginPath(); ctx.arc(x, y, 1.7, 0, Math.PI * 2); ctx.fill();
  });
  // 金属高光弧
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, outer - 4, -2.5, -1.2); ctx.stroke();
}

function drawSupplyBarrel() {
  const r = 28;
  // 桶身
  const g = ctx.createLinearGradient(-r, 0, r, 0);
  g.addColorStop(0, '#6E4527');
  g.addColorStop(0.35, C.wood);
  g.addColorStop(0.62, '#E8B878');
  g.addColorStop(1, '#5C3A22');
  ctx.fillStyle = g;
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2.4;
  roundRect(-r, -r, r * 2, r * 2, 9); ctx.fill(); ctx.stroke();
  // 板条
  ctx.strokeStyle = 'rgba(110,69,39,0.5)';
  ctx.lineWidth = 1.4;
  for (let x = -18; x <= 18; x += 12) {
    ctx.beginPath(); ctx.moveTo(x, -r + 3); ctx.lineTo(x, r - 3); ctx.stroke();
  }
  // 金属箍
  ctx.strokeStyle = '#7D95A6';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-r + 2, -12); ctx.lineTo(r - 2, -12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r + 2, 12); ctx.lineTo(r - 2, 12); ctx.stroke();
  // 桶盖
  ctx.fillStyle = 'rgba(255,236,200,0.35)';
  ctx.beginPath(); ctx.ellipse(0, -r + 6, r - 6, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(5,36,46,0.35)';
  ctx.beginPath(); ctx.ellipse(0, -r + 6, r - 6, 6, 0, 0, Math.PI * 2); ctx.stroke();
  // 标签
  ctx.fillStyle = C.cream;
  roundRect(-11, -6, 22, 12, 3); ctx.fill();
  ctx.fillStyle = C.coralDark;
  ctx.font = '700 7px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('物资', 0, 0);
  // 高光
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-r + 7, -r + 10); ctx.lineTo(-r + 7, r - 10); ctx.stroke();
}

function drawElectricEel(silhouette=false){

  if(!silhouette){ctx.strokeStyle='#E4CF77';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-17,7);ctx.lineTo(-11,8);ctx.moveTo(-4,-5);ctx.lineTo(1,-1);ctx.stroke();
    ctx.fillStyle='#FFF0B1';ctx.beginPath();ctx.arc(20,-1,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172E31';ctx.beginPath();ctx.arc(20.5,-1,1,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#E5DB8B';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(2,-18);ctx.lineTo(-2,-12);ctx.lineTo(4,-12);ctx.lineTo(0,-7);ctx.stroke();}

}

  ctx.beginPath(); ctx.ellipse(0, 0, 15, 8.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-24, -8); ctx.lineTo(-24, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#EDE7DA';
  ctx.beginPath(); ctx.arc(8, -2, 3.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#17140F';
  ctx.beginPath(); ctx.arc(8.6, -2, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(23,20,15,0.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(2, -6); ctx.quadraticCurveTo(6, 0, 2, 6); ctx.stroke();
}
function drawTangleNet() {

  ctx.strokeStyle = 'rgba(62,110,92,0.9)';
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 14, 0.2, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,170,140,0.85)';
  ctx.lineWidth = 1.6;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(-18, i * 5); ctx.quadraticCurveTo(0, i * 5 + 4, 18, i * 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i * 7, -12); ctx.quadraticCurveTo(i * 7 + 4, 0, i * 7, 12); ctx.stroke();
  }
  ctx.fillStyle = '#E2A24A';
  ctx.strokeStyle = '#17140F'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-14, -11, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}
function drawOilBarrel() {

  ctx.fillStyle = '#2E3338';
  ctx.strokeStyle = '#17140F'; ctx.lineWidth = 3;
  roundRect(-14, -17, 28, 34, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4A5157';
  ctx.fillRect(-14, -6, 28, 4);
  ctx.fillRect(-14, 6, 28, 4);
  ctx.fillStyle = 'rgba(20,24,28,0.9)';
  ctx.beginPath(); ctx.ellipse(16, 14, 9, 4, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(120,190,205,0.5)';
  ctx.beginPath(); ctx.ellipse(16, 14, 5, 2, -0.3, 0, Math.PI * 2); ctx.fill();
}
function drawSeedPouch() {
  // 麻布小袋 + 绿芽，比箱子小一圈
  ctx.strokeStyle = '#17140F'; ctx.lineWidth = 3;
  ctx.fillStyle = '#C8B48C';
  ctx.beginPath();
  ctx.moveTo(-11, -8);
  ctx.quadraticCurveTo(-14, 12, 0, 14);
  ctx.quadraticCurveTo(14, 12, 11, -8);
  ctx.quadraticCurveTo(0, -14, -11, -8);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#7A6242'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-10, -8); ctx.lineTo(10, -8); ctx.stroke();
  ctx.strokeStyle = '#4F7C3A'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(0, -8); ctx.quadraticCurveTo(2, -16, 7, -20); ctx.stroke();
  ctx.fillStyle = '#6FA052';

// ================= 木筏（网格建造） =================
function drawBoat() {
  ctx.save();
  ctx.translate(BOAT.x, BOAT.y + Math.sin(state.time * 1.7) * 2);
  ctx.scale(0.68, 0.68);
  ctx.translate(-W / 2, -H * 0.48);
  drawHomeWorld(false);
  ctx.restore();
}
function drawLegacyBoat() {
  const bob = Math.sin(state.time * 1.7) * 2.2;
  ctx.save();
  ctx.translate(BOAT.x, BOAT.y + bob);

  // 统计占用格
  const occupied = [];
  for (let r = 0; r < GRID_N; r++) {
    for (let c = 0; c < GRID_N; c++) {
      if (moduleAt(r, c)) occupied.push({ r, c, type: moduleAt(r, c), x: (c - 2) * CELL, y: (r - 2) * CELL });
    }
  }
  let minX = 0, maxX = 0, minY = 0, maxY = 0;
  if (occupied.length) {
    minX = Math.min(...occupied.map((o) => o.x)) - CELL / 2;
    maxX = Math.max(...occupied.map((o) => o.x)) + CELL / 2;
    minY = Math.min(...occupied.map((o) => o.y)) - CELL / 2;
    maxY = Math.max(...occupied.map((o) => o.y)) + CELL / 2;
  }

  // 水面阴影 / 泡沫
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const hw = Math.max(24, (maxX - minX) / 2 + 6), hh = Math.max(18, (maxY - minY) / 2 + 6);
  ctx.fillStyle = 'rgba(4,42,56,0.25)';
  ctx.beginPath(); ctx.ellipse(cx + 3, cy + 12, hw + 8, hh + 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(234,253,255,0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, cy + 10, hw + 12, hh + 8, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(234,253,255,0.22)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 14, hw + 22, hh + 12, 0, 0, Math.PI * 2); ctx.stroke();

  // 甲板格
  for (const o of occupied) {
    drawDeckTile(o.x, o.y, o.r, o.c);
  }
  // 甲板上的猫爪印
  for (const o of occupied) {
    if (o.type === 'deck' && (o.r * 3 + o.c) % 4 === 0) drawPaw(o.x + 7, o.y + 8, 0.7, 0.35);
  }
  // 小屋不再自动出现：必须建「船屋」模块
  const nDecks = deckCount();
  // 模块
  for (const o of occupied) {
    if (o.type === 'purifier') drawPurifierModule(o.x, o.y);
    else if (o.type === 'storage') drawStorageModule(o.x, o.y);
    else if (o.type === 'lamp') drawLampModule(o.x, o.y);
    else if (o.type === 'house') drawSalvageHut(o.x, o.y + CELL * 0.28, 0.95);
  }

  // 栏杆 + 绿植 + 猫（只有建了船屋才有猫住）
  drawDeckRailing(occupied);
  if (hasHouse()) {
    drawPlantProp(minX + 8, maxY - 6);
    drawPlantProp(maxX - 8, minY + 22);
    drawCatCrew(CELL * 0.95, CELL * 0.72, 1.02, 'captain');
    if (state.purifier) drawCatCrew(-CELL * 0.95, CELL * 0.95, 0.92, 'mechanic', true);
  }

  // 中央绞盘 + 小旗
  drawWinch(0, 0);
  const top = occupied.slice().sort((a, b) => a.y - b.y)[0];
  if (top && nDecks < 4) {
    const fx = top.x + CELL * 0.28, fy = top.y - CELL / 2;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 24); ctx.stroke();
    ctx.fillStyle = C.coral;
    ctx.beginPath();
    ctx.moveTo(fx, fy - 24);
    ctx.lineTo(fx + 18, fy - 19);
    ctx.lineTo(fx, fy - 14);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(43,27,18,0.6)'; ctx.lineWidth = 1.2; ctx.stroke();
    drawCatEmblem(fx + 9, fy - 19, 0.5, 0.9);
  }

  ctx.restore();

  // 建造模式：网格覆盖 + 合法格高亮
  if (state.buildMode) {
    for (let r = 0; r < GRID_N; r++) {
      for (let c = 0; c < GRID_N; c++) {
        const pos = cellPos(r, c);
        const occupiedCell = !!moduleAt(r, c);
        if (occupiedCell) continue;
        const valid = hasAdjacentPlatform(r, c);
        ctx.save();
        if (valid) {
          ctx.fillStyle = 'rgba(255,201,60,0.14)';
          roundRect(pos.x - CELL / 2 + 2, pos.y - CELL / 2 + 2, CELL - 4, CELL - 4, 5); ctx.fill();
          ctx.strokeStyle = 'rgba(255,201,60,0.75)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 3]);
          roundRect(pos.x - CELL / 2 + 2, pos.y - CELL / 2 + 2, CELL - 4, CELL - 4, 5); ctx.stroke();
          ctx.setLineDash([]);
          ctx.strokeStyle = 'rgba(255,244,218,0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(pos.x - 5, pos.y); ctx.lineTo(pos.x + 5, pos.y);
          ctx.moveTo(pos.x, pos.y - 5); ctx.lineTo(pos.x, pos.y + 5);
          ctx.stroke();
        } else {
          ctx.strokeStyle = 'rgba(255,255,255,0.10)';
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 4]);
          roundRect(pos.x - CELL / 2 + 2, pos.y - CELL / 2 + 2, CELL - 4, CELL - 4, 4); ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.restore();
      }
    }
  }
}

function drawSalvageHut(cx, baseY, s) {
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(s, s);
  // 硬投影
  ctx.fillStyle = 'rgba(3,30,38,0.28)';
  ctx.beginPath(); ctx.ellipse(2, 4, 48, 14, 0, 0, Math.PI * 2); ctx.fill();
  // 墙
  const gw = ctx.createLinearGradient(-42, 0, 42, 0);
  gw.addColorStop(0, '#E3B77E');
  gw.addColorStop(0.5, C.wood);
  gw.addColorStop(1, '#7A4A2A');
  ctx.fillStyle = gw;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  roundRect(-42, -48, 84, 48, 3); ctx.fill(); ctx.stroke();
  // 墙板
  ctx.strokeStyle = 'rgba(45,30,20,0.45)'; ctx.lineWidth = 1.4;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(-42 + i * 21, -46); ctx.lineTo(-42 + i * 21, -2); ctx.stroke();
  }
  // 屋顶（A 字形，带补丁）
  ctx.fillStyle = '#C96A4A';
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(-54, -48);
  ctx.lineTo(0, -92);
  ctx.lineTo(54, -48);
  ctx.lineTo(44, -40);
  ctx.lineTo(0, -76);
  ctx.lineTo(-44, -40);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 屋顶板缝
  ctx.strokeStyle = 'rgba(45,30,20,0.5)'; ctx.lineWidth = 1.2;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(i * 16, -52); ctx.lineTo(i * 6, -82); ctx.stroke();
  }
  // 窗
  ctx.fillStyle = '#F7E9B5';
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
  roundRect(-30, -36, 20, 15, 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-20, -36); ctx.lineTo(-20, -21); ctx.moveTo(-30, -28.5); ctx.lineTo(-10, -28.5); ctx.stroke();
  // 门
  ctx.fillStyle = '#5A3A22';
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
  roundRect(10, -38, 20, 38, 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.gold;
  ctx.beginPath(); ctx.arc(26, -18, 2.2, 0, Math.PI * 2); ctx.fill();
  // 猫徽记
  drawCatEmblem(0, -28, 0.7, 0.55);
  // 灯
  ctx.fillStyle = 'rgba(229,169,60,0.35)';
  ctx.beginPath(); ctx.arc(40, -30, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.gold;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  roundRect(36, -38, 8, 12, 2); ctx.fill(); ctx.stroke();
  // 屋顶小旗
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, -92); ctx.lineTo(0, -112); ctx.stroke();
  ctx.fillStyle = C.coral;
  ctx.beginPath(); ctx.moveTo(0, -112); ctx.lineTo(16, -107); ctx.lineTo(0, -102); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.stroke();
  drawCatEmblem(8, -107, 0.52, 0.95);
  ctx.restore();
}

function drawDeckRailing(occupied) {
  ctx.save();
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2;
  for (const o of occupied) {
    const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    for (const [dr, dc] of dirs) {
      if (moduleAt(o.r + dr, o.c + dc)) continue;
      let px = o.x + dc * CELL / 2, py = o.y + dr * CELL / 2;
      if (dr === 0) { px += dc * 2; } else { py += dr * 2; }
      // 栏杆柱
      ctx.fillStyle = C.woodDark;
      roundRect(px - 2, py - 8, 4, 10, 1.5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.gold;
      ctx.beginPath(); ctx.arc(px, py - 8, 1.6, 0, Math.PI * 2); ctx.fill();
      // 绳索
      ctx.strokeStyle = C.ropeDark; ctx.lineWidth = 1.4;
      if (dr === 0) {
        ctx.beginPath(); ctx.moveTo(px - 2, py - 6); ctx.lineTo(px + dc * 6, py - 6); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(px, py - 6); ctx.lineTo(px, py - 12); ctx.stroke();
      }
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
    }
  }
  ctx.restore();
}

function drawPlantProp(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(3,30,38,0.25)';
  ctx.beginPath(); ctx.ellipse(2, 8, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#B5653C';
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, -2); ctx.lineTo(7, -2); ctx.lineTo(5, 10); ctx.lineTo(-5, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#2F6B3A'; ctx.lineWidth = 2.2;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(0, -2);
    ctx.quadraticCurveTo(i * 9, -14, i * 13, -22);
    ctx.stroke();
    ctx.fillStyle = '#4C9A56';
    ctx.beginPath();
    ctx.ellipse(i * 13, -23, 5, 3, i * 0.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 2, 5, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawBarrelProp(x, y) {

function drawCatCrew(x, y, s, type, flip) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * (flip ? -1 : 1), s);
  const ink = '#2A241F';
  const cfg = type === 'mechanic'
    ? { fur: '#B9BEC2', muzzle: '#F4F1E8', armor: '#5F7A88', trim: '#C79A4A', plume: '#D9DEE0' }
    : type === 'builder'
      ? { fur: '#E0BE8E', muzzle: '#FBF2E2', armor: '#9C7442', trim: '#E5B84A', plume: '#E5B84A' }
      : { fur: '#E0A05E', muzzle: '#FBF0DE', armor: '#4A90C2', trim: '#E5B84A', plume: '#F2C94C' };
  ctx.lineJoin = 'round';
  // 待机灵动：呼吸浮动 + 轻微摇摆
  const t = state.time;
  const phase = type === 'captain' ? 0 : type === 'mechanic' ? 1.7 : 3.1;
  const bob = Math.sin(t * 2 + phase) * 1.1;
  const sway = Math.sin(t * 1.6 + phase) * 0.02;
  ctx.translate(0, bob);
  ctx.rotate(sway * 0.5);

  // 投影
  ctx.fillStyle = 'rgba(12,20,22,0.32)';
  ctx.beginPath(); ctx.ellipse(0, 1, 13, 3.8, 0, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = ink; ctx.lineWidth = 3;

  // 尾巴（随呼吸摆动）
  ctx.save();
  ctx.translate(9, -14);
  ctx.rotate(Math.sin(t * 1.8 + phase) * 0.18);
  ctx.translate(-9, 14);
  ctx.fillStyle = cfg.fur;
  ctx.beginPath();
  ctx.moveTo(9, -14); ctx.quadraticCurveTo(25, -18, 23, -36); ctx.quadraticCurveTo(22, -45, 15, -42);
  ctx.quadraticCurveTo(20, -34, 7, -22); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();

  // 腿 + 金属靴
  ctx.fillStyle = cfg.armor;
  roundRect(-9, -12, 7, 12, 2.5); ctx.fill(); ctx.stroke();
  roundRect(2, -12, 7, 12, 2.5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = cfg.trim;
  roundRect(-9, -4, 7, 4, 1.5); ctx.fill(); ctx.stroke();
  roundRect(2, -4, 7, 4, 1.5); ctx.fill(); ctx.stroke();

  // 身体：圆滚滚 + 胸甲
  ctx.fillStyle = cfg.fur;
  ctx.beginPath();
  ctx.moveTo(-13, -29); ctx.quadraticCurveTo(-17, -10, -9, -6);
  ctx.quadraticCurveTo(0, -2, 9, -6); ctx.quadraticCurveTo(17, -10, 13, -29);
  ctx.quadraticCurveTo(0, -35, -13, -29); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 胸甲（贴合身体弧面 + 布料/皮带过渡）
  const cg = ctx.createLinearGradient(0, -31, 0, -7);
  cg.addColorStop(0, cfg.armor);
  cg.addColorStop(0.65, cfg.armor);
  cg.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(-11, -27); ctx.quadraticCurveTo(0, -32, 11, -27);
  ctx.lineTo(10, -12); ctx.quadraticCurveTo(0, -7, -10, -12); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 甲下布料
  ctx.fillStyle = '#2E3B44';
  roundRect(-9, -12, 18, 5, 2); ctx.fill(); ctx.stroke();
  // 皮带（肩甲连到胸甲）
  ctx.strokeStyle = '#6B4A2F'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(-10, -27); ctx.lineTo(-4.5, -17); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, -27); ctx.lineTo(4.5, -17); ctx.stroke();
  ctx.fillStyle = cfg.trim;
  for (const px of [-5, 0, 5]) { ctx.beginPath(); ctx.arc(px, -22.5, 1.1, 0, Math.PI * 2); ctx.fill(); }
  // 胸甲高光/金边
  ctx.fillStyle = cfg.trim;
  ctx.beginPath(); ctx.moveTo(-10, -26); ctx.quadraticCurveTo(0, -30, 10, -26); ctx.lineTo(9, -23); ctx.quadraticCurveTo(0, -27, -9, -23); ctx.closePath(); ctx.fill();
  // 猫爪徽章
  ctx.fillStyle = cfg.trim;
  ctx.beginPath(); ctx.ellipse(0, -18, 3.2, 2.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-3, -21, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -22, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(3, -21, 1.1, 0, Math.PI * 2); ctx.fill();

  // 肩甲 + 手臂
  ctx.fillStyle = cfg.armor;
  ctx.beginPath(); ctx.arc(-13, -25, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(13, -25, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = cfg.trim;
  ctx.beginPath(); ctx.arc(-13, -25, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -25, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = cfg.fur;
  roundRect(-16, -20, 5, 10, 2.5); ctx.fill(); ctx.stroke();
  roundRect(11, -20, 5, 10, 2.5); ctx.fill(); ctx.stroke();

  // 大圆头
  ctx.fillStyle = cfg.fur;
  ctx.beginPath(); ctx.arc(0, -40, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // 白口罩
  ctx.fillStyle = cfg.muzzle;
  ctx.beginPath(); ctx.ellipse(0, -35.5, 9, 6, 0, 0, Math.PI); ctx.fill();
  // 耳朵（头盔下露出一点）
  ctx.fillStyle = cfg.fur;
  ctx.beginPath(); ctx.moveTo(-14, -48); ctx.lineTo(-11, -57); ctx.lineTo(-4, -51); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14, -48); ctx.lineTo(11, -57); ctx.lineTo(4, -51); ctx.closePath(); ctx.fill(); ctx.stroke();

  // 头盔（贴合头骨 + 盔下阴影）
  const hg = ctx.createLinearGradient(0, -58, 0, -39);
  hg.addColorStop(0, cfg.armor);
  hg.addColorStop(0.7, cfg.armor);
  hg.addColorStop(1, 'rgba(0,0,0,0.30)');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(0, -43, 14.5, Math.PI * 1.02, Math.PI * 1.98);
  ctx.lineTo(12, -41); ctx.quadraticCurveTo(0, -46, -12, -41);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 盔下压住毛发的阴影
  ctx.fillStyle = 'rgba(20,30,35,0.30)';
  ctx.beginPath(); ctx.ellipse(0, -43.5, 13, 3.4, 0, 0, Math.PI); ctx.fill();
  // 下巴系带
  ctx.strokeStyle = '#4A3020'; ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(-13.5, -42);
  ctx.quadraticCurveTo(-9, -30.5, 0, -29.5);
  ctx.quadraticCurveTo(9, -30.5, 13.5, -42);
  ctx.stroke();
  // 头盔中脊
  ctx.fillStyle = cfg.trim;

function drawImpactBurst(x, y, t) {
  const a = Math.min(1, t * 3);
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = a;
  const rays = 12;
  const R = 38 + (1 - t) * 22;
  ctx.beginPath();
  for (let i = 0; i < rays * 2; i++) {
    const ang = (i / (rays * 2)) * Math.PI * 2;
    const r = i % 2 === 0 ? R : R * 0.55;
    const px = Math.cos(ang) * r, py = Math.sin(ang) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = C.gold;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.fill(); ctx.stroke();
  ctx.font = '900 18px "Arial Black", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = C.ink;
  ctx.strokeText('BAM!', 0, 0);
  ctx.fillStyle = C.coral;
  ctx.fillText('BAM!', 0, 0);
  ctx.restore();
}

function drawDeckTile(x, y, r, c) {
  const s = CELL - 3;
  const g = ctx.createLinearGradient(x, y - s / 2, x, y + s / 2);
  g.addColorStop(0, '#F0C98D');
  g.addColorStop(0.5, C.wood);
  g.addColorStop(1, '#9A5A2B');
  ctx.fillStyle = g;
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2;
  roundRect(x - s / 2, y - s / 2, s, s, 5); ctx.fill(); ctx.stroke();
  // 板缝（按行列交替方向）
  ctx.strokeStyle = 'rgba(110,69,39,0.45)';
  ctx.lineWidth = 1;
  if ((r + c) % 2 === 0) {
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(x - s / 2 + 2, y + i * 8); ctx.lineTo(x + s / 2 - 2, y + i * 8); ctx.stroke();
    }
  } else {
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(x + i * 8, y - s / 2 + 2); ctx.lineTo(x + i * 8, y + s / 2 - 2); ctx.stroke();
    }
  }
  // 钉头
  ctx.fillStyle = 'rgba(60,40,25,0.6)';
  for (const dx of [-s * 0.32, s * 0.32]) {
    for (const dy of [-s * 0.32, s * 0.32]) {
      ctx.beginPath(); ctx.arc(x + dx, y + dy, 1.2, 0, Math.PI * 2); ctx.fill();

  }
  // 相邻边绳扣
  ctx.fillStyle = C.rope;
  if (!moduleAt(r - 1, c)) { ctx.beginPath(); ctx.arc(x, y - s / 2 + 2, 2, 0, Math.PI * 2); ctx.fill(); }
  if (!moduleAt(r + 1, c)) { ctx.beginPath(); ctx.arc(x, y + s / 2 - 2, 2, 0, Math.PI * 2); ctx.fill(); }
}

// ================= 钩锁 =================
function drawHook() {
  const a = hookAnchor();
  const h = state.hook;
  const idle=h.swinging&&!h.extending&&!h.retracting;
  const len=idle?(autoSwingMode()?32:15):h.length,angle=idle&&!autoSwingMode()?Math.PI:h.angle;
  const tip = { x: a.x + Math.sin(angle) * len, y: a.y - Math.cos(angle) * len };

  ctx.strokeStyle = C.ink; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  ctx.strokeStyle = C.rope; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  const knots = Math.max(2, Math.floor(len / 22));
  for (let i = 1; i < knots; i++) {
    const t = i / knots;
    ctx.fillStyle = C.ropeDark;
    ctx.beginPath(); ctx.arc(a.x + (tip.x - a.x) * t, a.y + (tip.y - a.y) * t, 2.2, 0, Math.PI * 2); ctx.fill();
  }

  drawClaw(tip.x, tip.y, angle + Math.PI, clamp(state.clawOpen, 0.02, 1));

  // 命中瞬间的“合拢”冲击环
  if (state.clawSnap > 0) {
    ctx.save();
    ctx.globalAlpha = state.clawSnap / 0.22;
    ctx.strokeStyle = 'rgba(255,244,218,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 10 + (0.22 - state.clawSnap) * 90, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 待机时不画额外的长瞄准线，避免钩子拖一条长线
}

// 六种配装各自替换整个工作头，共用吊环，不在基础三爪上叠附件。
function drawIntegratedClaw(open, magnet, fork, net) {
  const steel='#A7B9A7', copper='#B96E51', rope='#D6BD87';
  const stroke=(points,color,width)=>{
    ctx.strokeStyle=C.ink;ctx.lineWidth=width+3;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
  };
  const plate=(points,color)=>{
    ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
    ctx.fillStyle=color;ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.fill();ctx.stroke();
  };
  const pin=(x,y)=>{ctx.fillStyle=rope;ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);ctx.fill();ctx.stroke();};
  // 网面只有两组疏格，窄屏下保留开口和承重骨架。
  const mesh=(points)=>{
    plate(points,'rgba(204,176,115,0.17)');ctx.save();ctx.clip();
    ctx.strokeStyle=rope;ctx.lineWidth=1.2;
    for(let i=-48;i<48;i+=9){ctx.beginPath();ctx.moveTo(i,-5);ctx.lineTo(i+24,34);ctx.stroke();ctx.beginPath();ctx.moveTo(i,-5);ctx.lineTo(i-24,34);ctx.stroke();}
    ctx.restore();
  };
  ctx.fillStyle=steel;ctx.strokeStyle=C.ink;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,-10,4,0,Math.PI*2);ctx.fill();ctx.stroke();
  if(net && fork) {
    // 宽口捞斗：两侧叉臂共撑一张连续兜网，底部连成整体。
    const mouth=8+open*17, heel=6+open*12;
    mesh([[-mouth,5],[0,8],[mouth,5],[heel,23],[6,27],[-6,27],[-heel,23]]);
    for(const side of [-1,1]){
      stroke([[side*3,-5],[side*mouth,5],[side*heel,23],[side*6,27]],steel,3.2);
      pin(side*4,-4);
    }
    stroke([[-mouth,5],[0,8],[mouth,5]],rope,2.7);
    stroke([[-6,27],[6,27]],steel,3.2);
  } else if(net && magnet) {
    // 磁吸网篮：铜制承重肋就是磁路，浅色磁极组成篮口。
    const mouth=5+open*12;
    mesh([[-mouth,7],[-10,24],[0,29],[10,24],[mouth,7]]);
    for(const side of [-1,1]){
      stroke([[side*3,-5],[side*11,0],[side*mouth,7],[side*10,24],[0,29]],copper,3.5);
      plate([[side*(mouth-4),4],[side*(mouth+1),4],[side*(mouth+1),11],[side*(mouth-4),11]],'#E2DDC4');
    }
    stroke([[-3,-5],[3,-5]],copper,5);
  } else if(net) {
    // 单口开合网篮，开口宽度随收爪变化，没有残留的三根爪齿。
    const mouth=4+open*13;
    mesh([[-mouth,3],[-11,23],[0,29],[11,23],[mouth,3]]);
    for(const side of [-1,1]){
      stroke([[0,-6],[side*mouth,3],[side*11,23],[0,29]],steel,2.6);
      pin(side*mouth,3);
    }
    stroke([[-mouth,3],[mouth,3]],rope,3);
  } else if(fork && magnet) {
    // 双口磁夹：磁极直接成为两对夹齿，共用一根承重横梁。
    stroke([[0,-6],[0,-1]],copper,5);
    stroke([[-14,0],[14,0]],copper,5);
    for(const center of [-12,12]){
      const spread=3+open*5;
      for(const side of [-1,1]){
        stroke([[center,1],[center+side*spread,10],[center+side*spread*.6,22]],copper,3.5);
        plate([[center+side*spread*.6-2.4,18],[center+side*spread*.6+2.4,18],[center+side*spread*.6+2.4,24],[center+side*spread*.6-2.4,24]],'#E2DDC4');
      }
      pin(center,0);
    }
  } else if(fork) {
    // 两组独立的双齿钩，从同一横梁分出，替换中心三爪。
    stroke([[0,-6],[0,-1]],steel,4);
    stroke([[-13,0],[13,0]],'#C5A06A',4);
    for(const center of [-12,12]){
      const spread=2+open*6;
      for(const side of [-1,1])stroke([[center,1],[center+side*spread,11],[center+side*spread*.6,23],[center+side*1.5,20]],steel,3);
      pin(center,0);
    }
  } else {
    // 粗圆弧马蹄机身和宽磁靴形成磁头主体，窄屏下也不再像普通细爪。
    const spread=8+open*7;
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(-spread,19);ctx.lineTo(-14,4);
    ctx.quadraticCurveTo(-14,-6,0,-6);ctx.quadraticCurveTo(14,-6,14,4);ctx.lineTo(spread,19);
    ctx.strokeStyle=C.ink;ctx.lineWidth=12;ctx.stroke();
    ctx.strokeStyle='#B95543';ctx.lineWidth=8.5;ctx.stroke();
    // 顶部线圈箍带属于磁路机身，不是挂在外面的额外附件。
    plate([[-7,-9],[7,-9],[7,-2],[-7,-2]],'#D5AA68');
    ctx.strokeStyle='#775238';ctx.lineWidth=1.1;
    for(const x of [-3,0,3]){ctx.beginPath();ctx.moveTo(x,-8);ctx.lineTo(x,-3);ctx.stroke();}
    for(const side of [-1,1]){
      const x=side*spread;
      plate([[x-6,14],[x+6,14],[x+6,27],[x-6,27]],'#EBE1BC');
      // 左右磁靴端面用旧红漆/蓝灰漆区分磁极；大色块优先于微小字母。
      ctx.fillStyle=side<0?'#BB5C48':'#75B6BD';ctx.fillRect(x-4.7,21,9.4,4.5);
      ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x-5,20);ctx.lineTo(x+5,20);ctx.stroke();
    }
  }
}

// 未配装保留原三爪；配装后仅绘制对应的整合工作头。
function drawClaw(x, y, angle, open) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(0.82,0.82);
  const magnet = kitHas('magnet'), fork = kitHas('fork'), net = kitHas('net');
  if(magnet || fork || net){drawIntegratedClaw(open,magnet,fork,net);ctx.restore();return;}
  const closed = open < 0.35;
  const spread = 3.5 + open * 12;

  ctx.shadowColor = 'rgba(214,195,139,0.35)';
  ctx.shadowBlur = state.clawSnap>0?4:0;

  // 顶部吊环
  ctx.fillStyle = C.iron;
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, -9, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // 爪身
  const g = ctx.createLinearGradient(-6, 0, 6, 10);
  g.addColorStop(0, '#C8C9AD');
  g.addColorStop(0.5, '#91A79A');
  g.addColorStop(1, '#536E68');
  ctx.fillStyle = g;
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(-6, -5);
  ctx.lineTo(6, -5);
  ctx.lineTo(4, 4);
  ctx.lineTo(-4, 4);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // 三根爪齿（向下张开，爪尖略向内收）
  const prongs = [
    { sx: -5, sy: 2, cx: -spread - 2, cy: 11, ex: -spread * 0.45, ey: 19 },
    { sx: 0, sy: 4, cx: 0, cy: 13, ex: 0, ey: 21 },
    { sx: 5, sy: 2, cx: spread + 2, cy: 11, ex: spread * 0.45, ey: 19 },
  ];
  prongs.forEach((p) => {
    const drawProng = (color, width) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(p.sx, p.sy);
      ctx.quadraticCurveTo(p.cx, p.cy, p.ex, p.ey);
      ctx.stroke();
    };
    drawProng(C.ink, 6);
    drawProng(closed ? '#C8CDB8' : '#A7B9A7', 3.4);
    // 爪尖小钩
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(p.ex, p.ey);
    ctx.lineTo(p.ex * 0.7, p.ey - 3);
    ctx.stroke();
    ctx.fillStyle = C.iron;
    ctx.beginPath(); ctx.arc(p.ex * 0.7, p.ey - 3, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  });

  // 高光
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-1, 2); ctx.stroke();
  ctx.restore();
}

// 拖动瞄准：从船心到手指的虚线 + 判定环
// 用“环”而不是“点”作为准星：手指按在目标上时，环的两侧仍然看得见
function drawAimOverlay() {
  if (!state.aiming || state.buildMode || autoSwingMode()) return;
  const a = hookAnchor();
  const dx = state.aimX - a.x, dy = state.aimY - a.y;
  const dist = Math.max(1, Math.hypot(dx, dy));
  const len = Math.min(dist, MAX_LEN());
  const tx = a.x + (dx / dist) * len;
  const ty = a.y + (dy / dist) * len;
  const ring = 30;
  const over = dist > MAX_LEN();
  // 环内真的有东西＝这一爪会中，用实线白环直接告诉玩家
  let willHit = false;
  if(defenseRunning()&&!['warning','safe','rescue'].includes(state.defense.phase)){
    const p=defensePoint();willHit=!over&&Math.hypot(p.x-tx,p.y-ty)<=23;
  }
  if (!over) {
    for (const d of state.debris) {
      if (d.caught) continue;
      if (Math.hypot(d.x - tx, d.y - ty) <= hitRadius(d)) { willHit = true; break; }
    }
  }
  ctx.save();
  // 虚线轨迹
  ctx.strokeStyle = over ? 'rgba(255,255,255,0.35)' : 'rgba(255,201,60,0.55)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.setLineDash([]);
  // 判定环（对应命中半径），环边在指膜两侧可见
  if (willHit) {
    ctx.strokeStyle = 'rgba(255,255,255,0.96)';
    ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.arc(tx, ty, ring, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(tx, ty, 3, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.strokeStyle = over ? 'rgba(255,255,255,0.5)' : 'rgba(255,201,60,0.9)';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(tx, ty, ring, 0, Math.PI * 2); ctx.stroke();
  }
  // 环内十字与中心留空，不遮挡目标
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(tx - ring - 6, ty); ctx.lineTo(tx - ring + 2, ty);
  ctx.moveTo(tx + ring - 2, ty); ctx.lineTo(tx + ring + 6, ty);
  ctx.moveTo(tx, ty - ring - 6); ctx.lineTo(tx, ty - ring + 2);
  ctx.moveTo(tx, ty + ring - 2); ctx.lineTo(tx, ty + ring + 6);
  ctx.stroke();
  // 超出绳长的提示：环变白并轻微下移，告诉玩家“够不到”
  if (over) {
    ctx.font = '800 9px "Arial Black", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(5,36,46,0.85)';
    ctx.strokeText('超出范围', tx, ty + ring + 14);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText('超出范围', tx, ty + ring + 14);
  }
  ctx.restore();
}

function drawMatIcon(kind, x, y, r) {
  ctx.save();

    ctx.fillStyle = C.cream; ctx.fillRect(-r * 0.18, -r * 0.7, r * 0.36, r * 0.32);

function drawRouteStrip(x, y, w, h) {
  const milestones = [
    { name: '建住舱', done: homeCount('cabin') > 0 },
    { name: '救伙伴', done: state.cats.length >= 2 },
    { name: '净水房', done: homeCount('purifier') > 0 },
    { name: '上岗生产', done: homeFacilities().some(f => (f.type === 'purifier' || f.type === 'kitchen') && catsAtFacility(f.key).length > 0) },
  ];
  let current = milestones.findIndex((m) => !m.done);
  if (current === -1) current = milestones.length - 1;
  const n = milestones.length;
  const step = w / n;
  ctx.strokeStyle = 'rgba(237,231,218,0.20)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + step * 0.5, y + 12);
  ctx.lineTo(x + w - step * 0.5, y + 12);
  ctx.stroke();

  milestones.forEach((m, i) => {
    const cx = x + step * (i + 0.5);
    const cy = y + 12;
    const isCurrent = i === current;
    const r = 10;
    ctx.fillStyle = isCurrent ? C.gold : m.done ? 'rgba(63,111,107,0.85)' : 'rgba(255,255,255,0.12)';
    ctx.strokeStyle = 'rgba(237,231,218,0.28)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, isCurrent ? r : r - 1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (isCurrent) {
      ctx.strokeStyle = 'rgba(199,154,74,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r + 4 + Math.sin(state.time * 4) * 1.5, 0, Math.PI * 2); ctx.stroke();
    }
    // 图标
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = isCurrent || m.done ? C.ink : 'rgba(237,231,218,0.6)';
    ctx.fillStyle = isCurrent || m.done ? C.ink : 'rgba(237,231,218,0.6)';
    ctx.lineWidth = 1.8;
    if (i === 0) {
      ctx.beginPath(); ctx.moveTo(-6, 1); ctx.quadraticCurveTo(0, 6, 6, 1); ctx.lineTo(5, 3); ctx.quadraticCurveTo(0, 7, -5, 3); ctx.closePath(); ctx.stroke();
    } else if (i === 1) {
      for (let k = -1; k <= 1; k++) { ctx.fillRect(-5, k * 3 - 1, 10, 2.2); }
    } else if (i === 2) {
      ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, 6); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-6, 1); ctx.lineTo(0, -6); ctx.lineTo(6, 1); ctx.stroke();
      ctx.fillRect(-4, 1, 8, 5);
    }
    ctx.restore();
    txt(m.name, cx, y + h - 2, 8, isCurrent ? C.gold : m.done ? C.cream : C.creamSoft, '700');
  });
}

  txt(costStr, x + w / 2, y + 68, 9, afford ? C.ink : 'rgba(45,45,45,0.45)', '700');

  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;

  txt(afford ? '升级' : '缺料', x + w / 2, y + 85, 8.5, afford ? C.cream : C.ink, '800');
  ctx.restore();
}

function drawCardIcon(card, x, y, r, dim) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = dim ? 0.3 : 1;
  ctx.lineWidth = 1.8;
  if (card.key === 'build') {
    // 网格 + 加号
    ctx.strokeStyle = C.wood; ctx.lineWidth = 1.6;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(-r * 0.7, i * r * 0.7); ctx.lineTo(r * 0.7, i * r * 0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(i * r * 0.7, -r * 0.7); ctx.lineTo(i * r * 0.7, r * 0.7); ctx.stroke();
    }
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(0, -r * 0.35); ctx.lineTo(0, r * 0.35); ctx.moveTo(-r * 0.35, 0); ctx.lineTo(r * 0.35, 0); ctx.stroke();
  } else if (card.key === 'deck') {
    ctx.fillStyle = C.wood; ctx.strokeStyle = 'rgba(5,36,46,0.8)';
    roundRect(-r, -r * 0.6, r * 2, r * 0.5, 2); ctx.fill(); ctx.stroke();
    roundRect(-r, r * 0.05, r * 2, r * 0.5, 2); ctx.fill(); ctx.stroke();
  } else if (card.key === 'winch') {
    ctx.fillStyle = C.gold; ctx.strokeStyle = 'rgba(5,36,46,0.8)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(5,36,46,0.85)';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.rotate(i * Math.PI / 2); ctx.fillRect(-1.2, -r, 2.4, r * 0.45); ctx.restore();
    }
  } else if (card.key === 'rope') {
    ctx.strokeStyle = C.teal; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, Math.PI * 1.7); ctx.stroke();
    ctx.strokeStyle = C.cream; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(r * 0.2, -r * 0.2); ctx.lineTo(r * 1.1, -r * 0.6); ctx.stroke();
  } else {
    ctx.fillStyle = C.teal; ctx.strokeStyle = 'rgba(5,36,46,0.8)';
    roundRect(-r * 0.65, -r, r * 1.3, r * 2, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.cream;
    roundRect(-r * 0.3, -r * 0.45, r * 0.6, r * 0.6, 2); ctx.fill();
    ctx.fillStyle = C.sea0;
    ctx.beginPath(); ctx.arc(0, r * 0.55, r * 0.22, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

const MUD_SPOTS = [[0.06, 0.2, 11], [0.13, 0.36, 7], [0.04, 0.52, 9], [0.16, 0.66, 6],
  [0.94, 0.24, 10], [0.88, 0.42, 7], [0.96, 0.58, 8], [0.86, 0.72, 6],

function drawWaterHazards() {
  if (state.mudSplash > 0.02) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, state.mudSplash) * 0.5;

function drawEffects() {

}

function drawTutorial() {
  const step = state.tutorialStep;
  if (step >= 4 || state.paused || state.buildMode) return;
  if (state.screen !== 'salvage') return;
  const a = hookAnchor();

  // 首次命中：大声确认因果关系
  if (step === 3) {
    const t = clamp((state.time - state.tutorialStepAt) / 1.6, 0, 1);
    ctx.save();
    ctx.globalAlpha = 1 - t * 0.85;
    const sc = 1 + Math.max(0, 0.3 - t * 1.8);
    ctx.translate(W / 2, a.y - 104);
    ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 7; ctx.strokeStyle = C.ink;
    ctx.font = '900 26px "Arial Black", "PingFang SC", sans-serif';
    ctx.strokeText('抓到啦！', 0, 0);
    ctx.fillStyle = C.gold; ctx.fillText('抓到啦！', 0, 0);
    ctx.restore();
    return;
  }
  if (step === 2) return; // 已出爪，等结果再说
  if(autoSwingMode()){
    const h=state.hook,dx=Math.sin(h.angle),dy=-Math.cos(h.angle);
    const len=Math.min(MAX_LEN(),90),x=a.x+dx*len,y=a.y+dy*len;
    ctx.save();ctx.strokeStyle='rgba(255,201,60,.72)';ctx.lineWidth=2;ctx.setLineDash([5,6]);
    ctx.beginPath();ctx.moveTo(a.x+dx*43,a.y+dy*43);ctx.lineTo(x,y);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    const cy=SEA_BOTTOM-76;uiBox(28,cy,W-56,52);
    txt('抓钩自动摆动，看准方向点一下',W/2,cy+17,12,C.cream,'800');
    txt('点击海面出钩；手指位置不改变方向',W/2,cy+37,10,C.creamSoft,'500');return;
  }

  // 演示目标：优先选最近的漂流物，海面空时用船侧固定点
  let tgt = null, bd = 1e9;
  for (const d of state.debris) {
    if (d.caught || d.catPod) continue;
    const dist = Math.hypot(d.x - a.x, d.y - a.y);
    if (dist < MAX_LEN() * 0.92 && dist < bd) { tgt = { x: d.x, y: d.y }; bd = dist; }
  }
  if (!tgt) tgt = { x: a.x + 58, y: a.y + 88 };

  const t = (Math.sin(state.time * 2.2) + 1) / 2;
  // step 0 的触点只走到目标圈边缘内侧，不要把目标圈遮死
  const fx = step === 0 ? a.x + (tgt.x - a.x) * (0.12 + t * 0.62) : tgt.x;
  const fy = step === 0 ? a.y + (tgt.y - a.y) * (0.12 + t * 0.62) : tgt.y + 4 + t * 10;

  ctx.save();
  // 目标圈＝判定环，和实际命中范围一致
  ctx.strokeStyle = 'rgba(255,201,60,0.75)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 5]);
  ctx.beginPath(); ctx.arc(tgt.x, tgt.y, 30 + Math.sin(state.time * 3) * 3, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // 手指触点：实心圆 + 外环脉动，沿滑向目标方向移动，表达“拖动”
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = 'rgba(237,231,218,0.22)';
  ctx.beginPath(); ctx.arc(fx, fy, 20 + Math.sin(state.time * 4) * 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.cream;
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(fx, fy, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.globalAlpha = 1;

  // 松手箭头（抬手指），避开目标圈与触点
  if (step === 1) {
    ctx.strokeStyle = C.cream;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(fx, fy - 20); ctx.lineTo(fx, fy - 34);
    ctx.moveTo(fx - 6, fy - 27); ctx.lineTo(fx, fy - 35); ctx.lineTo(fx + 6, fy - 27);
    ctx.stroke();
  }
  ctx.restore();

  // 底部教学卡（放在海面下缘，不挡漂流物）
  const cw = W - 56, cx = 28, cy = SEA_BOTTOM - 92;
  ctx.save();
  ctx.fillStyle = C.surface;
  roundRect(cx, cy, cw, 48, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,201,60,0.55)'; ctx.lineWidth = 1.5;
  roundRect(cx, cy, cw, 48, 12); ctx.stroke();
  const title = step === 0 ? '按住海面拖动' : '松手就出爪';
  const sub = step === 0 ? '爪跟着手指转，落在圈里就能抓' : '够不着时，先靠近再打';
  txt(title, W / 2, cy + 17, 13, C.cream, '800');
  txt(sub, W / 2, cy + 35, 9.5, C.creamSoft, '400');
  ctx.restore();
}

// ================= 斜俯视（2:1 等距）木筏 =================
const ISO_W = 64, ISO_H = 33;
function isoCell(r, c) {
  return { x: BUILD_CX + (c - r) * ISO_W / 2, y: BUILD_CY + (c + r - (GRID_N - 1)) * ISO_H / 2 };
}
function isoDiamondPath(x, y, w, h) {
  ctx.beginPath();
  ctx.moveTo(x, y - h / 2);
  ctx.lineTo(x + w / 2, y);
  ctx.lineTo(x, y + h / 2);
  ctx.lineTo(x - w / 2, y);
  ctx.closePath();
}
function drawIsoSlab(x, y, w, h, height, topCol, leftCol, rightCol) {
  const Y = y - height;
  ctx.fillStyle = leftCol;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, Y); ctx.lineTo(x, Y + h / 2); ctx.lineTo(x, Y + h / 2 + height); ctx.lineTo(x - w / 2, Y + height); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = rightCol;
  ctx.beginPath();
  ctx.moveTo(x, Y + h / 2); ctx.lineTo(x + w / 2, Y); ctx.lineTo(x + w / 2, Y + height); ctx.lineTo(x, Y + h / 2 + height); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = topCol;
  isoDiamondPath(x, Y, w, h);
  ctx.fill(); ctx.stroke();
  // 木纹/高光
  ctx.strokeStyle = 'rgba(35,22,12,0.32)';
  ctx.lineWidth = 1;
  for (let k = -1; k <= 1; k++) {
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + 5, Y + k * (h / 5));
    ctx.quadraticCurveTo(x, Y + h / 5.5 + k * (h / 5), x + w / 2 - 5, Y + k * (h / 5));
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,240,210,0.18)';
  ctx.beginPath();
  ctx.moveTo(x - w / 2 + 6, Y - 2);
  ctx.lineTo(x, Y - h / 2 + 4);
  ctx.stroke();
}
function drawIsoDeck(r, c) {
  const p = isoCell(r, c);
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2.4;
  drawIsoSlab(p.x, p.y, ISO_W - 2, ISO_H - 2, 8, '#A9743F', '#4A2D1A', '#6B4226');
  ctx.strokeStyle = 'rgba(28,20,14,0.5)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    const t = i / 3;
    ctx.beginPath();
    ctx.moveTo(p.x - (ISO_W - 2) / 2 + (ISO_W - 2) * t, p.y - 8);
    ctx.lineTo(p.x + (ISO_W - 2) * t, p.y - 8 + (ISO_H - 2) / 2);
    ctx.stroke();
  }
}
function drawIsoModule(r, c, type) {
  const p = isoCell(r, c);
  drawIsoDeck(r, c);
  const baseY = p.y - 8;
  if (type === 'purifier') {
    drawIsoSlab(p.x, baseY, 26, 15, 20, '#5F9C93', '#2C4E4B', '#3B6B64');
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
    ctx.fillStyle = '#D8CFB5';
    ctx.beginPath(); ctx.rect(p.x - 7, baseY - 14, 14, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2C4E4B';
    ctx.fillRect(p.x - 4, baseY - 11, 8, 3);
    ctx.strokeStyle = C.ropeDark; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(p.x + 13, baseY - 6); ctx.lineTo(p.x + 18, baseY - 6); ctx.stroke();
  } else if (type === 'storage') {
